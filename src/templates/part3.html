<script>
const D = __DATA__;

/* ---------- design tokens ---------- */
const C = {pd:'#3e1151',pm:'#60537f',pl:'#aaa5bb',gl:'#d8d8da',bg:'#f7f7f8',
           pink:'#ff0090',blue:'#0085ca',yellow:'#fedb00',green:'#00B388'};
const FONT = {family:'"Segoe UI",system-ui,sans-serif',color:'#241032'};
const BASE = {font:FONT, paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)',
  margin:{l:60,r:20,t:10,b:50}, hoverlabel:{font:{family:FONT.family,size:13}},
  legend:{orientation:'h',y:-0.18,font:{size:12}},
  xaxis:{gridcolor:'#eeebf1',zerolinecolor:'#d8d8da'},
  yaxis:{gridcolor:'#eeebf1',zerolinecolor:'#d8d8da'}};
const CFG = {responsive:true, displaylogo:false,
  modeBarButtonsToRemove:['lasso2d','select2d','autoScale2d']};
const L = o => Object.assign(JSON.parse(JSON.stringify(BASE)), o||{});
const YRS = D.years;
const last = a => a[a.length-1], prev = a => a[a.length-2];
const pct = (a,b) => (a/b-1)*100;
const fmtM = v => '£'+(v/1000).toFixed(v>=100000?0:1)+'m';
const fmtN = v => v.toLocaleString('en-GB');
const deltaHtml = p => {
  if(p===null||!isFinite(p)) return '';
  const cls = p>1?'up':(p<-1?'down':'flat');
  const sym = p>1?'▲':(p<-1?'▼':'•');
  return `<div class="d ${cls}">${sym} ${Math.abs(p).toFixed(1)}% vs prior year</div>`;
};

/* ---------- tab switching (lazy render) ---------- */
const rendered = {};
const renderers = {home:renderHome, context:renderContext, framework:renderFramework,
                   trends:renderTrends, explorer:renderExplorer,
                   cases:renderCases};
function go(tab, subOpt){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.tab').forEach(s=>s.classList.toggle('show',s.id==='tab-'+tab));
  if(!rendered[tab]){ rendered[tab]=true; renderers[tab](); }
  // Deep-link into a Trends sub-tab if requested (e.g. from Home → Skills tile)
  if(tab==='trends' && subOpt) selectTrendSub(subOpt);
  window.scrollTo({top:0});
}
function selectTrendSub(which){
  document.querySelectorAll('#trendsSubnav button').forEach(b=>b.classList.toggle('active',b.dataset.trend===which));
  document.querySelectorAll('#tab-trends .trendpanel').forEach(p=>p.classList.toggle('show',p.id==='trend-'+which));
}
function renderTrends(){
  // Wire the top-level Trends sub-nav (R&I ↔ Skills)
  document.getElementById('trendsSubnav').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||!b.dataset.trend) return;
    selectTrendSub(b.dataset.trend);
    // R&I side has lazy renderers of its own — kick them if that side is now active
    if(b.dataset.trend==='ri' && !rendered._ri){ rendered._ri=true; renderFindings(); }
  });
  // First visit: render the R&I side by default
  if(!rendered._ri){ rendered._ri=true; renderFindings(); }
}
document.getElementById('nav').addEventListener('click',e=>{ if(e.target.dataset.tab) go(e.target.dataset.tab); });
document.querySelectorAll('.tile[data-go]').forEach(t=>t.addEventListener('click',()=>go(t.dataset.go, t.dataset.sub)));

/* ================= HOME ================= */
function renderHome(){
  const N = D.national;
  Plotly.newPlot('heroPulse',[{
    x:YRS, y:N.real.map(v=>v/1000), type:'scatter', mode:'lines',
    line:{color:C.pink,width:3,shape:'spline'}, fill:'tozeroy', fillcolor:'rgba(255,0,144,.14)',
    hovertemplate:'%{x}: £%{y:.0f}m<extra></extra>'
  }],L({margin:{l:0,r:0,t:6,b:18},height:120,showlegend:false,
       xaxis:{showgrid:false,tickfont:{color:'#cbb6da',size:10},showline:false},
       yaxis:{visible:false,rangemode:'tozero'}}),CFG);

  const kpis=[
    {v:fmtM(last(N.real)), l:'Business collaboration income, 2024/25 (real)', d:pct(last(N.real),prev(N.real)), cls:''},
    {v:fmtN(last(N.n_sme)+last(N.n_lc)), l:'Business interactions, 2024/25', d:pct(last(N.n_sme)+last(N.n_lc), prev(N.n_sme)+prev(N.n_lc)), cls:'b'},
    {v:fmtN(last(N.spin)), l:'Spinouts surviving 3+ years (sum across providers)', d:pct(last(N.spin),prev(N.spin)), cls:'g'},
    {v:fmtM(last(N.lic)), l:'Licensing income, 2024/25 (real)', d:pct(last(N.lic),prev(N.lic)), cls:'y'}];
  document.getElementById('homeKpis').innerHTML = kpis.map(k=>
    `<div class="kpi ${k.cls}"><div class="v">${k.v}</div><div class="l">${k.l}</div>${deltaHtml(k.d)}</div>`).join('');
}

/* ================= CONTEXT (live ONS/OECD data when fetched; cached otherwise) ================= */
function renderContext(){
  const X=D.ctx;
  const upd=document.getElementById('ctxUpdated');
  if(upd) upd.textContent='Data refreshed: '+X.meta.updated+(X.meta.live&&X.meta.live.length?' · live: '+X.meta.live.join('; '):'');
  const months=X.gdpMonthly.months, serv=X.gdpMonthly.services,
        prod=X.gdpMonthly.production, cons=X.gdpMonthly.construction;
  const net = serv.map((v,i)=>+(v+prod[i]+cons[i]).toFixed(2));
  Plotly.newPlot('chGdp',[
    {x:months,y:serv,name:'Services',type:'bar',marker:{color:C.pm}},
    {x:months,y:prod,name:'Production',type:'bar',marker:{color:C.pink}},
    {x:months,y:cons,name:'Construction',type:'bar',marker:{color:C.blue}},
    {x:months,y:net,name:'Net GDP growth',type:'scatter',mode:'lines+markers',
     line:{color:C.pd,width:2.5},marker:{size:6}}
  ],L({barmode:'relative',yaxis:{ticksuffix:'%',gridcolor:'#eeebf1',zerolinecolor:'#9a90a6',title:{text:'Month-on-month growth',font:{size:12}}},
       hovermode:'x unified'}),CFG);

  const q=X.intl.quarters, intl=X.intl.series;
  const ic={UK:C.blue,EU:C.pd,'United States':C.green,Japan:C.pink};
  Plotly.newPlot('chIntl',Object.keys(intl).map(k=>({
    x:q,y:intl[k],name:k,type:'scatter',mode:'lines+markers',
    line:{width:k==='UK'?4:2,color:ic[k]||C.pl},marker:{size:k==='UK'?7:5},
    opacity:k==='UK'?1:.75,connectgaps:false
  })),L({yaxis:{ticksuffix:'%',zerolinecolor:'#9a90a6'},hovermode:'x unified'}),CFG);

  const dv=X.deficit.values;
  Plotly.newPlot('chDeficit',[{
    x:X.deficit.years,y:dv,type:'bar',marker:{color:dv.map(v=>v>=40?C.pink:(v>=33?C.pm:C.pl))},
    text:dv.map(v=>v.toFixed(0)+'%'),textposition:'outside',textfont:{size:13,color:C.pd},
    hovertemplate:'%{x}: %{y:.1f}% of universities in deficit<extra></extra>'
  }],L({yaxis:{ticksuffix:'%',range:[0,Math.max(...dv)*1.15],title:{text:'Universities operating at a deficit',font:{size:12}}},showlegend:false}),CFG);

  const B=X.berd;
  Plotly.newPlot('chBerd',[
    {x:B.fyears.concat([...B.fyears].reverse()),y:B.up.concat([...B.lo].reverse()),fill:'toself',
     fillcolor:'rgba(255,0,144,.10)',line:{width:0},hoverinfo:'skip',name:'95% CI',showlegend:true},
    {x:B.years,y:B.values,name:'Business R&D spend',type:'scatter',mode:'lines+markers',line:{color:C.pd,width:3},marker:{size:7}},
    {x:B.fyears,y:B.fc,name:'Forecast',type:'scatter',mode:'lines',line:{color:C.pink,width:2.5,dash:'dot'}}
  ],L({yaxis:{tickprefix:'£',ticksuffix:'bn'},hovermode:'x unified'}),CFG);

  const vcol={'United States':C.green,'United Kingdom':C.blue,France:C.pd,Germany:C.yellow,Italy:C.pink};
  Plotly.newPlot('chVc',Object.keys(X.vc.series).map(k=>({
    x:X.vc.years,y:X.vc.series[k],name:k,type:'scatter',mode:'lines',
    line:{width:k==='United Kingdom'?4:2,color:vcol[k]||C.pl},opacity:k==='United Kingdom'?1:.8,
    hovertemplate:k+': %{y:.2f}% of GDP<extra></extra>'
  })),L({yaxis:{ticksuffix:'%'},hovermode:'x unified'}),CFG);
}

/* ================= FRAMEWORK ================= */
function renderFramework(){
  const lab=['SMEs','Large businesses','Consultancy','Facilities & equipment','Contract research','IP licensing'];
  Plotly.newPlot('chPillarFlow',[{
    type:'sankey',orientation:'h',
    node:{label:lab,pad:22,thickness:18,
      color:[C.blue,C.pd,C.pm,C.green,C.pink,C.yellow],
      line:{width:0},
      hovertemplate:'%{label}: £%{value:.0f}m<extra></extra>'},
    link:{source:[0,0,0,0,1,1,1,1],target:[2,3,4,5,2,3,4,5],
      value:[90,87,86,86,126,82,636,146],
      color:['rgba(0,133,202,.30)','rgba(0,133,202,.30)','rgba(0,133,202,.30)','rgba(0,133,202,.30)',
             'rgba(62,17,81,.28)','rgba(62,17,81,.28)','rgba(62,17,81,.28)','rgba(62,17,81,.28)'],
      hovertemplate:'%{source.label} → %{target.label}: £%{value:.0f}m<extra></extra>'}
  }],L({margin:{l:10,r:10,t:10,b:10},height:300}),CFG);
  const note=document.querySelector('#tab-framework .section .note');
  renderGtrTable();
  if(note) note.innerHTML='Follow the money, 2024/25 (CPD & training excluded): £'+ (90+87+86+86) +'m of business income comes from SMEs and £'+(126+82+636+146)+'m from large businesses, across four streams — consultancy, facilities & equipment, contract research and IP licensing. Contract research dominates large-business income; licensing income is roughly evenly split. The GtR pillar adds the publicly co-funded flows this picture misses.';
}

/* ---------- GtR pillar-4 indicator table (framework tab) ---------- */
const GTR_CAT_ORDER=['Volume & Scale','Intensity & Productivity','Innovation Depth'];
function renderGtrTable(){
  const t=document.getElementById('gtrTable'); if(!t||t.innerHTML) return;
  let html='<thead><tr><th style="width:64px">ID</th><th>Indicator</th><th class="c">Value</th><th class="c" style="width:110px">Unit</th></tr></thead><tbody>';
  for(const cat of GTR_CAT_ORDER){
    html+=`<tr class="cat"><td colspan="4">${cat}</td></tr>`;
    for(const r of D.gtr.indicators.filter(x=>x.category===cat)){
      html+=`<tr class="data" title="${(r.note||'').replace(/"/g,'&quot;')}">
        <td style="font-weight:700;color:var(--purple-mid)">${r.id}</td><td>${r.name}</td>
        <td class="c" style="font-weight:700">${r.value}</td><td class="c" style="font-size:12px;color:#6d6478">${r.unit}</td></tr>`;
    }
  }
  t.innerHTML=html+'</tbody>';
}

/* ================= FINDINGS ================= */
const REGION_GROUPS={
  'Scotland':['Devolved nations',C.pm],'Northern Ireland':['Devolved nations',C.pm],'Wales':['Devolved nations',C.pm],
  'London':['Southern England',C.pink],'South East':['Southern England',C.pink],'South West':['Southern England',C.pink],
  'East of England':['Midlands & East',C.blue],'East Midlands':['Midlands & East',C.blue],'West Midlands':['Midlands & East',C.blue],
  'North West':['Northern England',C.green],'North East':['Northern England',C.green],'Yorkshire and The Humber':['Northern England',C.green]};
const CLUSTERS=['Very large and highly research intensive','Large and research intensive',
  'Large with teaching and research focus','Small and mid-size, teaching focus','STEM specialists',
  'Scotland','Wales','Northern Ireland','Unclassified'];
const CLUSTER_COL={'Very large and highly research intensive':C.pd,'Large and research intensive':C.pink,
  'Large with teaching and research focus':C.blue,'Small and mid-size, teaching focus':C.green,
  'STEM specialists':C.yellow,'Scotland':C.pm,'Wales':'#b86bd4','Northern Ireland':'#7a4f9e','Unclassified':C.pl};

function renderFindings(){
  const N=D.national;
  const kpis=[
    {v:fmtM(last(N.real)),l:'Real BCI 2024/25 — '+(pct(last(N.real),N.real[4])).toFixed(0)+'% vs pre-Covid (2018/19)',d:pct(last(N.real),prev(N.real)),cls:''},
    {v:fmtN(last(N.n_sme)),l:'SME interactions, 2024/25',d:pct(last(N.n_sme),prev(N.n_sme)),cls:'b'},
    {v:fmtN(last(N.n_lc)),l:'Large business interactions, 2024/25',d:pct(last(N.n_lc),prev(N.n_lc)),cls:'b'},
    {v:fmtN(last(N.lic_n)),l:'Licences granted, 2024/25',d:pct(last(N.lic_n),prev(N.lic_n)),cls:'y'}];
  document.getElementById('findKpis').innerHTML=kpis.map(k=>
    `<div class="kpi ${k.cls}"><div class="v">${k.v}</div><div class="l">${k.l}</div>${deltaHtml(k.d)}</div>`).join('');

  /* BCI trend: stacked SME / LC */
  Plotly.newPlot('chBciTrend',[
    {x:YRS,y:N.real_sme.map(v=>v/1000),name:'From SMEs',stackgroup:'a',mode:'lines',
     line:{width:.5,color:C.blue},fillcolor:'rgba(0,133,202,.45)',hovertemplate:'SMEs: £%{y:.0f}m<extra></extra>'},
    {x:YRS,y:N.real_lc.map(v=>v/1000),name:'From large businesses',stackgroup:'a',mode:'lines',
     line:{width:.5,color:C.pd},fillcolor:'rgba(62,17,81,.55)',hovertemplate:'Large: £%{y:.0f}m<extra></extra>'},
    {x:YRS,y:N.real.map(v=>v/1000),name:'Total',mode:'lines+markers',
     line:{color:C.pink,width:3},marker:{size:6},hovertemplate:'Total: £%{y:.0f}m<extra></extra>'}
  ],L({yaxis:{tickprefix:'£',ticksuffix:'m'},hovermode:'x unified'}),CFG);

  /* interactions */
  Plotly.newPlot('chInteractions',[
    {x:YRS,y:N.n_sme,name:'SME interactions',mode:'lines+markers',line:{color:C.blue,width:3},marker:{size:6}},
    {x:YRS,y:N.n_lc,name:'Large business interactions',mode:'lines+markers',line:{color:C.pd,width:3},marker:{size:6}}
  ],L({hovermode:'x unified',yaxis:{rangemode:'tozero'}}),CFG);

  /* funnel plot */
  const traces={};
  for(const k in D.growth){
    const u=D.unis[k], g=D.growth[k], size=u.real[YRS.length-2];
    const cl=u.cluster;
    (traces[cl]=traces[cl]||{x:[],y:[],t:[]});
    traces[cl].x.push(size/1000); traces[cl].y.push(Math.max(-100,Math.min(200,g)));
    traces[cl].t.push(`<b>${u.name}</b><br>${u.region}<br>2023/24 BCI: ${fmtM(size)}<br>Growth: ${g>0?'+':''}${g.toFixed(1)}%`);
  }
  const ftr=CLUSTERS.filter(c=>traces[c]).map(c=>({
    x:traces[c].x,y:traces[c].y,text:traces[c].t,name:c,type:'scatter',mode:'markers',
    marker:{size:9,color:CLUSTER_COL[c],opacity:.78,line:{width:1,color:'#fff'}},
    hovertemplate:'%{text}<extra></extra>'}));
  Plotly.newPlot('chFunnel',ftr,L({
    xaxis:{type:'log',title:{text:'Real BCI 2023/24 (£m, log scale)',font:{size:12}},gridcolor:'#eeebf1'},
    yaxis:{title:{text:'Real BCI growth 2023/24 → 2024/25 (%)',font:{size:12}},ticksuffix:'%',zerolinecolor:'#9a90a6',zerolinewidth:2},
    legend:{orientation:'h',y:-0.22},height:520,
    shapes:[{type:'line',x0:0.0002,x1:300,y0:0,y1:0,line:{color:'#9a90a6',width:1,dash:'dot'}}]
  }),CFG);

  /* regional box */
  const order=['Scotland','Northern Ireland','Wales','London','South East','South West',
    'East of England','East Midlands','West Midlands','North West','North East','Yorkshire and The Humber'];
  const btr=order.map(r=>{
    const ys=[],ts=[];
    for(const k in D.growth){ const u=D.unis[k];
      if(u.region===r){ ys.push(Math.max(-100,Math.min(200,D.growth[k]))); ts.push(u.name); } }
    return {y:ys,text:ts,name:r,type:'box',boxpoints:'all',jitter:.5,pointpos:0,
      marker:{color:REGION_GROUPS[r][1],size:5,opacity:.7},
      line:{color:REGION_GROUPS[r][1]},fillcolor:REGION_GROUPS[r][1]+'22',
      hovertemplate:'%{text}: %{y:.1f}%<extra>'+r+'</extra>'};
  });
  Plotly.newPlot('chRegionBox',btr,L({
    showlegend:false,height:520,
    yaxis:{title:{text:'Real BCI growth 2023/24 → 2024/25 (%)',font:{size:12}},ticksuffix:'%',zerolinecolor:'#9a90a6',zerolinewidth:2},
    xaxis:{tickangle:-30,tickfont:{size:11}}}),CFG);

  /* income mix shares (business clients only; CPD excluded) */
  const streams=[['Consultancy',D.national.consult,C.blue],
                 ['Facilities & equipment',D.national.fe,C.green],
                 ['Contract research',D.national.contract,C.pink]];
  const stot=YRS.map((_,i)=>streams.reduce((a,[,arr])=>a+arr[i],0));
  Plotly.newPlot('chMix',streams.map(([name,arr,col])=>({
    x:YRS,y:arr.map((v,i)=>v/stot[i]*100),name,stackgroup:'m',mode:'lines',
    line:{width:.5,color:col},fillcolor:col+'77',
    customdata:arr.map(v=>v/1000),
    hovertemplate:name+': %{y:.1f}% (£%{customdata:.0f}m)<extra></extra>'
  })),L({yaxis:{ticksuffix:'%',range:[0,100]},hovermode:'x unified'}),CFG);

  /* commercialisation */
  Plotly.newPlot('chCommerc',[
    {x:YRS,y:N.lic.map(v=>v/1000),name:'Licensing income (real)',type:'bar',marker:{color:C.pm},yaxis:'y'},
    {x:YRS,y:N.spin,name:'Spinouts surviving 3+ yrs',mode:'lines+markers',line:{color:C.pink,width:3},marker:{size:6},yaxis:'y2'}
  ],L({yaxis:{tickprefix:'£',ticksuffix:'m',title:{text:'Licensing income',font:{size:11}}},
       yaxis2:{overlaying:'y',side:'right',title:{text:'Spinouts',font:{size:11}},gridcolor:'rgba(0,0,0,0)'},
       hovermode:'x unified'}),CFG);

  renderScorecard();
  initMap();
  initPareto();
  initSubnav();
}

/* ---------- Pareto concentration ---------- */
function initPareto(){
  const sel=document.getElementById('paretoMetric');
  if(!sel) return;
  sel.addEventListener('change',drawPareto);
  drawPareto();
}

function drawPareto(){
  const key=document.getElementById('paretoMetric').value;
  const yi=D.years.length-1;
  const labelMap={
    real:'business collaboration income',
    contract:'contract research income',
    consult:'consultancy income',
    fe:'facilities & equipment income',
    lic:'licensing income',
    ext:'external investment in spinouts'
  };
  const metricLabel=labelMap[key]||key;

  // Collect (name, value) for the latest year, filter out null/zero
  const entries=[];
  for(const k in D.unis){
    const u=D.unis[k];
    const v=u[key]&&u[key][yi];
    if(v!=null && v>0) entries.push({name:u.name, value:v});
  }
  entries.sort((a,b)=>b.value-a.value);
  const N=entries.length;
  const total=entries.reduce((s,e)=>s+e.value,0);

  // Pareto curve: cumulative share of providers vs cumulative share of income
  let cumV=0;
  const xPct=[0], yPct=[0], hoverNames=[''], hoverVals=[0];
  for(let i=0;i<N;i++){
    cumV+=entries[i].value;
    xPct.push((i+1)/N*100);
    yPct.push(cumV/total*100);
    hoverNames.push(entries[i].name);
    hoverVals.push(entries[i].value/1000);
  }

  // Reference quantile shares (top 10%, 20%, 50%)
  const shareAt=(p)=>{
    const idx=Math.ceil(N*p/100);
    let s=0;for(let i=0;i<idx;i++)s+=entries[i].value;
    return total>0?s/total*100:0;
  };
  const s10=shareAt(10), s20=shareAt(20), s50=shareAt(50);
  // Gini coefficient (area between 45° line and Pareto curve, normalised)
  let area=0;
  for(let i=1;i<xPct.length;i++){
    area+=(xPct[i]-xPct[i-1])*(yPct[i]+yPct[i-1])/2;
  }
  const gini=Math.max(0,Math.min(1,(area-5000)/5000));   // (areaUnderCurve - 50%) / 50%

  // Build chart: 45° equality line + Pareto curve + reference markers
  const traces=[
    {x:[0,100],y:[0,100],name:'Equal distribution',mode:'lines',
     line:{color:'#aaa5bb',width:1.5,dash:'dash'},hoverinfo:'skip'},
    {x:xPct,y:yPct,name:'Cumulative share',mode:'lines',
     line:{color:C.pd,width:3,shape:'spline'},
     fill:'tonexty',fillcolor:'rgba(255,0,144,.10)',
     customdata:hoverNames.map((n,i)=>[n,hoverVals[i]]),
     hovertemplate:'Top %{x:.0f}% of providers<br>capture %{y:.0f}% of '+metricLabel+
                   '<br><i>%{customdata[0]}</i> added: £%{customdata[1]:.1f}m<extra></extra>'},
    {x:[10,20,50],y:[s10,s20,s50],name:'Quantile markers',mode:'markers+text',
     marker:{color:C.pink,size:11,line:{color:'#fff',width:2}},
     text:['Top 10%: '+s10.toFixed(0)+'%','Top 20%: '+s20.toFixed(0)+'%','Top 50%: '+s50.toFixed(0)+'%'],
     textposition:['top right','top right','top right'],
     textfont:{size:11,color:C.pd},
     hovertemplate:'%{text}<extra></extra>'}
  ];
  Plotly.newPlot('chPareto',traces,L({
    height:430,
    xaxis:{title:{text:'Cumulative share of providers (ranked highest to lowest)',font:{size:11}},
           ticksuffix:'%',range:[0,100],dtick:10},
    yaxis:{title:{text:'Cumulative share of '+metricLabel,font:{size:11}},
           ticksuffix:'%',range:[0,102]},
    showlegend:false, margin:{l:80,r:30,t:10,b:60}}),CFG);

  // Plain-English narrative
  const narr=document.getElementById('paretoNarrative');
  if(narr){
    // Find which threshold matches the "80/X" question — what % of providers
    // capture 80% of the metric?
    let idx80=xPct.findIndex((_,i)=>i>0 && yPct[i]>=80);
    const pct80=idx80>0?xPct[idx80]:100;
    const concentration =
      s10>=70?'extreme':s10>=55?'very high':s10>=40?'high':s10>=30?'moderate':'modest';
    narr.innerHTML=
      `<b>How to read this chart.</b> Each point on the curve answers: "if you ranked all `+
      `${N} providers reporting <b>${metricLabel}</b> from largest to smallest, what fraction of the UK total `+
      `do the biggest <i>n</i>% capture?". The dashed diagonal is what perfect equality would look like — every `+
      `provider contributing the same. The further the curve bows above the diagonal, the more the income is `+
      `concentrated in a few institutions.<br><br>`+
      `<b>For ${metricLabel} in ${D.years[yi]}:</b> the top <b>10%</b> of providers (${Math.ceil(N*0.10)} institutions) account for `+
      `<b>${s10.toFixed(0)}%</b> of the total — concentration is <b>${concentration}</b>. The top 20% capture <b>${s20.toFixed(0)}%</b>, `+
      `and the top 50% capture <b>${s50.toFixed(0)}%</b>. ${pct80<100?`The classic "80/20" line is at <b>${pct80.toFixed(0)}/80</b> here — meaning ${pct80.toFixed(0)}% of providers produce 80% of this income.`:''} `+
      `The implied Gini coefficient is <b>${gini.toFixed(2)}</b> — for context, 0.00 would be perfect equality, 1.00 would mean a single provider captures everything.`;
  }
}

/* ---------- BCI growth decomposition ---------- */
function initDecomp(){
  const sel=document.getElementById('decompGroup');
  if(!sel) return;
  const clusters=Object.keys(D.clusterAgg||{}).filter(c=>c!=='Unclassified');
  // Preferred ordering of clusters
  const order=CLUSTERS.filter(c=>clusters.includes(c));
  sel.innerHTML='<option value="__all">All providers (UK)</option>'+
    order.map(c=>`<option value="${c}">${c}</option>`).join('');
  sel.addEventListener('change',drawDecomp);
  drawDecomp();
}

function drawDecomp(){
  if(!document.getElementById('decompGroup')) return;
  const group=document.getElementById('decompGroup').value;
  const src = group==='__all'
    ? {real:D.national.real, contract:D.national.contract, consult:D.national.consult,
       fe:D.national.fe, lic:D.national.lic}
    : D.clusterAgg[group];
  if(!src){return;}

  // Streams ordered consistently with the rest of the dashboard
  const streams=[
    {key:'consult', label:'Consultancy',            colour:C.blue},
    {key:'fe',      label:'Facilities & equipment', colour:C.green},
    {key:'contract',label:'Contract research',      colour:C.pink},
    {key:'lic',     label:'Licensing',              colour:C.pm}
  ];
  const yrs=D.years;
  // Find first and last years with non-null total
  const firstI=src.real.findIndex(v=>v!=null && v>0);
  const lastI =(src.real.length-1) - src.real.slice().reverse().findIndex(v=>v!=null && v>0);
  if(firstI<0 || lastI<=firstI){
    document.getElementById('chDecompContrib').innerHTML='<p class="note" style="text-align:center;padding:40px">Insufficient data for this group.</p>';
    return;
  }
  document.getElementById('decompFirstYr').textContent=yrs[firstI];
  document.getElementById('decompLastYr').textContent=yrs[lastI];

  const firstTotal=src.real[firstI];
  const lastTotal=src.real[lastI];
  const totalPct=(lastTotal/firstTotal-1)*100;

  // For each stream: weight (share of base-year total), % change, contribution (weight × pctChg)
  const rows=streams.map(s=>{
    const a=(src[s.key]||[])[firstI]||0;
    const b=(src[s.key]||[])[lastI]||0;
    const weight = firstTotal>0 ? a/firstTotal*100 : 0;
    const pctChg = a>0 ? (b/a-1)*100 : (b>0 ? null : 0);   // null = grew from zero
    const contrib= pctChg==null ? null : weight/100 * pctChg;
    return {...s, a, b, weight, pctChg, contrib};
  });

  // ── Decomposition contribution chart (horizontal bar, percentage points) ──
  const sumContrib=rows.reduce((acc,r)=>acc+(r.contrib||0),0);
  // Two traces — components and the total anchor — so each gets its own
  // hover text. Total sits at the top, component bars below, separated by a
  // dotted gridline.
  const compLabels=rows.map(r=>r.label);
  const compValues=rows.map(r=>r.contrib==null?0:+r.contrib.toFixed(1));
  const yAxisOrder=[...compLabels.slice().reverse(),'Total BCI change'];   // bottom→top

  const componentTrace={
    type:'bar', orientation:'h', name:'Component contribution',
    y:compLabels.slice().reverse(),
    x:compValues.slice().reverse(),
    marker:{color:rows.map(r=>r.colour).reverse()},
    text:rows.map(r=>r.contrib==null?'grew from £0':(r.contrib>0?'+':'')+r.contrib.toFixed(1)+'pp').reverse(),
    textposition:'outside', textfont:{size:12,color:'#3e1151'},
    customdata:rows.map(r=>[r.weight,r.pctChg||0,(r.a||0)/1000,(r.b||0)/1000]).reverse(),
    hovertemplate:'<b>%{y}</b><br>'+
                  'Starting weight: %{customdata[0]:.1f}% of total BCI<br>'+
                  'Total change %{customdata[1]:+.1f}% (£%{customdata[2]:.0f}m → £%{customdata[3]:.0f}m)<br>'+
                  '→ Contribution: %{x:+.1f}pp to total BCI growth'+
                  '<extra></extra>'
  };
  const totalTrace={
    type:'bar', orientation:'h', name:'Total BCI change',
    y:['Total BCI change'],
    x:[+totalPct.toFixed(1)],
    marker:{color:C.pd, line:{color:'#1a0524',width:1.5}},
    text:[(totalPct>0?'+':'')+totalPct.toFixed(1)+'%'],
    textposition:'outside', textfont:{size:13,color:'#3e1151'},
    customdata:[[firstTotal/1000,lastTotal/1000]],
    hovertemplate:'<b>Total BCI change</b><br>'+
                  '£%{customdata[0]:.0f}m → £%{customdata[1]:.0f}m<br>'+
                  '→ %{x:+.1f}% over the period'+
                  '<extra></extra>'
  };
  const allX=[...compValues,+totalPct.toFixed(1)];
  const xPad=Math.max(Math.abs(Math.min(0,...allX)),Math.abs(Math.max(0,...allX)))*0.18;
  const xMin=Math.min(0,...allX)-xPad, xMax=Math.max(0,...allX)+xPad;

  Plotly.newPlot('chDecompContrib',[componentTrace,totalTrace],L({
    height:330, margin:{l:170,r:80,t:10,b:50},
    barmode:'overlay',
    xaxis:{title:{text:'Change in BCI (percentage points / total %)',font:{size:11}},
           zerolinecolor:'#9a90a6',zerolinewidth:2,ticksuffix:'pp',range:[xMin,xMax]},
    yaxis:{tickfont:{size:12},
           categoryorder:'array',categoryarray:yAxisOrder,
           type:'category'},
    shapes:[
      // separator between Total bar (top) and component bars
      {type:'line',xref:'paper',x0:0,x1:1,y0:rows.length-0.5,y1:rows.length-0.5,
       line:{color:'#d0c8da',width:1,dash:'dot'}}
    ],
    showlegend:false}),CFG);

  // Narrative: pick the strongest driver by absolute contribution
  const ranked=rows.filter(r=>r.contrib!=null).sort((a,b)=>Math.abs(b.contrib)-Math.abs(a.contrib));
  const top=ranked[0];
  const note=document.getElementById('decompNote');
  if(note && top){
    const dir=totalPct>=0?'grew':'fell';
    const magnitude=Math.abs(totalPct).toFixed(1)+'%';
    const driverSign=top.contrib>0?'adding':'subtracting';
    const driverMag=Math.abs(top.contrib).toFixed(1)+'pp';
    const pctChgFmt=(top.pctChg>0?'+':'')+top.pctChg.toFixed(1)+'%';
    note.innerHTML=
      `Between ${yrs[firstI]} and ${yrs[lastI]}, total BCI for this group <b>${dir} by ${magnitude}</b>. `+
      `The dominant driver was <b>${top.label}</b>, ${driverSign} <b>${driverMag}</b> to the total — `+
      `it accounted for <b>${top.weight.toFixed(0)}%</b> of BCI in ${yrs[firstI]} and changed by <b>${pctChgFmt}</b> over the period. `+
      `<span style="color:#6d6478;font-size:12.5px">Decomposition check: the four components sum to ${(sumContrib>=0?'+':'')}${sumContrib.toFixed(1)}pp against the actual total change of ${(totalPct>=0?'+':'')}${totalPct.toFixed(1)}%; small differences are interaction effects between streams.</span>`;
  }

  // ── Absolute chart: total line + four streams stacked area ──
  const traces=[
    ...streams.map(s=>({
      x:yrs,y:(src[s.key]||[]).map(v=>v==null?null:v/1000),
      name:s.label,stackgroup:'one',mode:'lines',
      line:{width:.5,color:s.colour}, fillcolor:s.colour+'88'
    })),
    {x:yrs,y:src.real.map(v=>v==null?null:v/1000),name:'Total BCI',
     mode:'lines+markers',line:{color:C.pd,width:3},marker:{size:5}}
  ];
  Plotly.newPlot('chDecompAbs',traces,L({
    yaxis:{tickprefix:'£',ticksuffix:'m',rangemode:'tozero'},
    hovermode:'x unified', legend:{orientation:'h',y:-0.18}}),CFG);

  // ── Indexed chart: each series rebased to 100 at firstI ──
  const idx=(arr)=>{
    const base=arr[firstI];
    if(!base||base<=0) return arr.map(()=>null);
    return arr.map(v=>v==null?null:v/base*100);
  };
  const indexedTraces=[
    {x:yrs,y:idx(src.real),name:'Total BCI',mode:'lines+markers',
     line:{color:C.pd,width:3.5,shape:'spline'},marker:{size:6}},
    ...streams.map(s=>({
      x:yrs,y:idx(src[s.key]||[]),name:s.label,mode:'lines',
      line:{color:s.colour,width:2}
    }))
  ];
  Plotly.newPlot('chDecompIndexed',indexedTraces,L({
    yaxis:{title:{text:'Index ('+yrs[firstI]+' = 100)',font:{size:11}},
           zerolinecolor:'#9a90a6'},
    shapes:[{type:'line',x0:yrs[0],x1:yrs[yrs.length-1],y0:100,y1:100,
             line:{color:'#9a90a6',width:1.5,dash:'dot'}}],
    hovermode:'x unified', legend:{orientation:'h',y:-0.18}}),CFG);
}
function drawCagr(){
  const key=document.getElementById('cagrMetric').value;
  const floor=CAGR_METRICS.find(m=>m[0]===key)[2];
  const split=document.querySelector('#cagrSplit .split-btn.active')?.dataset.split||'total';
  // Enable/disable split buttons based on whether the metric supports splitting
  const splitMap=CAGR_SPLITS[key];
  const splitsAvailable=!!splitMap;
  document.querySelectorAll('#cagrSplit .split-btn').forEach(b=>{
    b.disabled=!splitsAvailable && b.dataset.split!=='total';
    if(b.disabled && b.classList.contains('active')){
      b.classList.remove('active');
      document.querySelector('#cagrSplit .split-btn[data-split="total"]').classList.add('active');
    }
  });
  // Update note about split availability
  const noteEl=document.getElementById('cagrSplitNote');
  if(noteEl) noteEl.textContent = splitsAvailable
    ? (split==='total'?'Showing combined SME + large-business figures.':
       split==='sme'?'Showing the SME-only stream.':'Showing the large-business stream only.')
    : 'This metric has no SME / large-business breakdown — showing total.';

  // Resolve the actual array to use for each provider
  const getArr = (u) => {
    if(!splitsAvailable) return u[key];
    if(split==='total' && splitMap.total==='__n_total'){
      // synthesise interactions total: SME count + LC count, year by year
      const a=u[splitMap.sme], b=u[splitMap.lc];
      if(!a||!b) return null;
      return a.map((v,i)=>(v==null||b[i]==null)?null:(v+b[i]));
    }
    const field = splitMap[split] || splitMap.total;
    return u[field];
  };

  const byCl={'All providers':[]};
  for(const k in D.unis){const u=D.unis[k];
    const arr=getArr(u); if(!arr) continue;
    const g=cagr5(arr,floor);
    if(g==null) continue;
    const entry={name:u.name,cagr:g};
    byCl['All providers'].push(entry);
    (byCl[u.cluster]=byCl[u.cluster]||[]).push(entry);}
  const rows=['All providers',...CLUSTERS.filter(c=>byCl[c]&&byCl[c].length>=4&&c!=='Unclassified')];
  const traces=BANDS.map(([name,test,col])=>({
    type:'bar',orientation:'h',name,marker:{color:col},
    y:rows.slice().reverse(),
    x:rows.slice().reverse().map(r=>byCl[r].filter(e=>test(e.cagr)).length/byCl[r].length*100),
    customdata:rows.slice().reverse().map(r=>[byCl[r].filter(e=>test(e.cagr)).length,byCl[r].length]),
    hovertemplate:'<b>%{y}</b><br>'+name+': %{x:.0f}% (%{customdata[0]} of %{customdata[1]} providers)<extra></extra>',
    text:rows.slice().reverse().map(r=>{const p=byCl[r].filter(e=>test(e.cagr)).length/byCl[r].length*100;return p>=8?p.toFixed(0)+'%':'';}),
    textposition:'inside',textfont:{size:11,color:name==='Significant increase'?'#3e1151':'#fff'}
  }));
  Plotly.newPlot('chCagr',traces,L({barmode:'stack',height:480,
    margin:{l:250,r:20,t:10,b:50},xaxis:{ticksuffix:'%',range:[0,100]},
    yaxis:{tickfont:{size:12}},legend:{orientation:'h',y:-0.14,traceorder:'normal'}}),CFG);

  /* distribution box plot — each dot now carries its provider name */
  const order=CLUSTERS.filter(c=>byCl[c]&&byCl[c].length>=4&&c!=='Unclassified');
  Plotly.newPlot('chCagrDist',order.map(c=>({
    y:byCl[c].map(e=>Math.max(-40,Math.min(60,e.cagr))),
    text:byCl[c].map(e=>e.name),
    customdata:byCl[c].map(e=>e.cagr.toFixed(1)),
    name:c,type:'box',
    boxpoints:'all',jitter:.5,pointpos:0,
    marker:{color:CLUSTER_COL[c],size:5,opacity:.7,line:{color:'#fff',width:.5}},
    line:{color:CLUSTER_COL[c]},
    fillcolor:CLUSTER_COL[c]+'22',
    hovertemplate:'<b>%{text}</b><br>%{customdata}%/yr<br><i>'+c+'</i><extra></extra>'
  })),L({showlegend:false,yaxis:{ticksuffix:'%',zerolinecolor:'#9a90a6',zerolinewidth:2,
    title:{text:'CAGR, %/yr (clipped ±40/60)',font:{size:11}}},
    xaxis:{showticklabels:false},hovermode:'closest'}),CFG);
}

/* ---------- choropleth map ---------- */
const REGIONS_ORDERED=['Scotland','Northern Ireland','Wales','London','South East','South West','East of England','East Midlands','West Midlands','North West','North East','Yorkshire and The Humber'];
const MAP_SCALES={
  real:[[0,'#f3eef7'],[0.4,'#aaa5bb'],[0.75,'#60537f'],[1,'#3e1151']],
  growth:[[0,'#ff0090'],[0.5,'#f7f7f8'],[1,'#00B388']]
};
function mapValue(metric,r,yi){
  const A=D.regionAgg[r]; if(!A) return null;
  if(metric==='real') return A.real[yi]/1000;
  if(metric==='realpp') return A.n[yi]?A.real[yi]/1000/A.n[yi]:null;
  if(metric==='lic') return A.lic[yi]/1000;
  if(metric==='growth'){
    if(yi===0) return null;
    const a=A.med[yi-1],b=A.med[yi];
    return (a&&b)?(b/a-1)*100:null;
  }
  return A[metric][yi];
}
function mapFmt(metric,v){
  if(v==null) return '–';
  if(metric==='real'||metric==='realpp'||metric==='lic') return '£'+v.toFixed(1)+'m';
  if(metric==='growth') return (v>0?'+':'')+v.toFixed(1)+'%';
  return Math.round(v).toLocaleString('en-GB');
}
function initMap(){
  const ySel=document.getElementById('mapYear');
  ySel.innerHTML=YRS.map((y,i)=>`<option value="${i}" ${i===YRS.length-1?'selected':''}>${y}</option>`).join('');
  document.getElementById('mapMetric').addEventListener('change',drawMap);
  ySel.addEventListener('change',drawMap);
  drawMap();
}
function drawMap(){
  const metric=document.getElementById('mapMetric').value;
  const yi=+document.getElementById('mapYear').value;
  const locs=[],vals=[],texts=[];
  for(const r of REGIONS_ORDERED){
    const v=mapValue(metric,r,yi);
    locs.push(r); vals.push(v);
    const A=D.regionAgg[r];
    texts.push(`<b>${r}</b> · ${YRS[yi]}<br>${document.getElementById('mapMetric').selectedOptions[0].text}: <b>${mapFmt(metric,v)}</b><br>Providers: ${A.n[yi]}<br>Real BCI: £${(A.real[yi]/1000).toFixed(0)}m · SME interactions: ${A.n_sme[yi].toLocaleString()}<br><i>Click to pin this region's trend</i>`);
  }
  const diverging=metric==='growth';
  const tr={type:'choropleth',geojson:D.geo,locations:locs,z:vals,
    featureidkey:'properties.region',text:texts,hovertemplate:'%{text}<extra></extra>',
    colorscale:diverging?MAP_SCALES.growth:MAP_SCALES.real,
    zmid:diverging?0:undefined,
    marker:{line:{color:'#fff',width:1.2}},
    colorbar:{thickness:14,len:.7,tickfont:{size:11},
      title:{text:diverging?'%':'',font:{size:11}}}};
  Plotly.newPlot('chMap',[tr],L({
    geo:{scope:'europe',fitbounds:'locations',projection:{type:'mercator'},
      bgcolor:'rgba(0,0,0,0)',showframe:false,showcoastlines:false,showland:false},
    margin:{l:0,r:0,t:6,b:0},height:520,dragmode:false}),CFG);
  document.getElementById('chMap').on('plotly_click',ev=>{
    if(ev.points&&ev.points[0]) pinRegion(ev.points[0].location);
  });
}
function pinRegion(r){
  const A=D.regionAgg[r]; if(!A) return;
  document.getElementById('mapDetail').style.display='block';
  document.getElementById('mapDetailTitle').textContent=r+' — trends, real terms';
  Plotly.newPlot('chMapTrend',[
    {x:YRS,y:A.real.map(v=>v/1000),name:'Real BCI (£m)',mode:'lines+markers',line:{color:C.pink,width:3},marker:{size:6}},
    {x:YRS,y:A.med.map(v=>v==null?null:v/1000),name:'Median provider BCI (£m)',mode:'lines',line:{color:C.pd,width:2,dash:'dash'}},
    {x:YRS,y:A.n_sme,name:'SME interactions',mode:'lines',line:{color:C.blue,width:2},yaxis:'y2'}
  ],L({height:300,yaxis:{tickprefix:'£',ticksuffix:'m',rangemode:'tozero'},
       yaxis2:{overlaying:'y',side:'right',gridcolor:'rgba(0,0,0,0)',rangemode:'tozero'},
       hovermode:'x unified',margin:{l:60,r:50,t:10,b:40}}),CFG);

function arrowFor(p){
  if(p>=10) return '<span class="arrow a-uu" title="10%+ above">⏫</span>';
  if(p>=1)  return '<span class="arrow a-u" title="1–10% above">⌃</span>';
  if(p>-1)  return '<span class="arrow a-f" title="within ±1%">—</span>';
  if(p>-10) return '<span class="arrow a-d" title="1–10% below">⌄</span>';
  return '<span class="arrow a-dd" title="10%+ below">⏬</span>';
}
function renderScorecard(){
  const N=D.national, li=YRS.length-1;
  const avg=(a,i0,i1)=>{let s=0,n=0;for(let i=i0;i<=i1;i++){s+=a[i];n++}return s/n};
  const rows=[
    ['cat','Collaboration activity'],
    ['SME interactions',N.n_sme,fmtN],
    ['Large business interactions',N.n_lc,fmtN],
    ['cat','Investment in collaboration'],
    ['Business collaboration income (real)',N.real,fmtM],
    ['BCI from SMEs (real)',N.real_sme,fmtM],
    ['BCI from large business (real)',N.real_lc,fmtM],
    ['UK industry funds in HE R&D (real)',N.uk_ind,fmtM],
    ['cat','Products of collaboration'],
    ['Licences granted',N.lic_n,fmtN],
    ['Licensing income (real)',N.lic,fmtM],
    ['Spinouts surviving 3+ years',N.spin,fmtN]];
  let html=`<thead><tr><th>Indicator</th><th class="c">2024/25</th><th class="c">YoY change</th><th class="c">Short-term<br><span style="font-weight:400;font-size:11px">vs 5-yr avg</span></th><th class="c">Long-term<br><span style="font-weight:400;font-size:11px">vs 10-yr avg</span></th><th class="c">Pre-Covid<br><span style="font-weight:400;font-size:11px">vs 2018/19</span></th></tr></thead><tbody>`;
  for(const r of rows){
    if(r[0]==='cat'){ html+=`<tr class="cat"><td colspan="6">${r[1]}</td></tr>`; continue; }
    const [name,a,f]=r;
    const cur=a[li];
    const comps=[[a[li-1],'2023/24'],[avg(a,li-5,li-1),'5-yr average'],[avg(a,li-10,li-1),'10-yr average'],[a[4],'2018/19']];
    html+=`<tr class="data"><td>${name}</td><td class="c" style="font-weight:700">${f(cur)}</td>`+
      comps.map(([b,lab])=>{const p=pct(cur,b);
        return `<td class="c" title="${f(cur)} vs ${f(b)} (${lab}): ${p>0?'+':''}${p.toFixed(1)}%">${arrowFor(p)}</td>`;}).join('')+'</tr>';
  }
  document.getElementById('scorecard').innerHTML=html+'</tbody>';
}

/* ---------- CSV exports ---------- */
function downloadCsv(name,rows){
  const esc=v=>{v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const csv=rows.map(r=>r.map(esc).join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}

function median(arr){ const a=arr.filter(v=>v!=null).sort((x,y)=>x-y);
  if(!a.length) return null; const m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2; }
function percentile(val,arr){ const a=arr.filter(v=>v!=null);
  if(val==null||!a.length) return null;
  return a.filter(v=>v<=val).length/a.length*100; }

  };
  const tracTip=u.trac?`OfS TRAC peer Group ${u.trac.group} — ${TRAC_CRIT[u.trac.group]||''}`:'No TRAC peer group mapping in trac_groups.csv';

/* ---------- shared: 5-year CAGR insight strip ---------- */
/* Computes 5-year CAGR for each metric and renders a narrative + badges. */
function cagrInfo(arr, floor){
  if(!arr) return null;
  const li=YRS.length-1, a=arr[li-5], b=arr[li];
  if(a==null||b==null||a<floor||b<0) return null;
  return (Math.pow(b/a,1/5)-1)*100;
}
function cagrBand(c){
  if(c==null) return {key:'nd',label:'insufficient data',arrow:''};
  if(c>=10)   return {key:'signif-up',  label:'significant growth', arrow:'▲▲'};
  if(c>=3)    return {key:'mod-up',     label:'moderate growth',    arrow:'▲'};
  if(c>-3)    return {key:'stable',     label:'broadly stable',     arrow:'■'};
  if(c>-10)   return {key:'mod-down',   label:'moderate decline',   arrow:'▼'};
  return       {key:'signif-down',label:'significant decline',arrow:'▼▼'};
}
function drawGrowthStrip(elId, u, metrics, narrativeFn){
  const el=document.getElementById(elId);if(!el) return;
  const results=metrics.map(([key,name,floor])=>{
    const c=cagrInfo(u[key],floor);
    return {key,name,cagr:c,band:cagrBand(c)};
  });
  const narrative=narrativeFn?narrativeFn(u,results):'';
  const badges=results.map(r=>{
    const arrow=r.band.arrow?`<span class="arrow">${r.band.arrow}</span>`:'';
    const val=r.cagr==null?'n/a':((r.cagr>0?'+':'')+r.cagr.toFixed(1)+'%/yr');
    return `<div class="cagr-badge ${r.band.key}">
      <div class="name">${escapeHtml(r.name)}</div>
      <div class="val">${arrow}<span>${val}</span></div>
      <div class="label-band">${r.band.label}</div>
    </div>`;
  }).join('');
  el.innerHTML=
    `<div class="label">5-year growth (${YRS[YRS.length-6]} → ${YRS[YRS.length-1]})</div>`+
    (narrative?`<div class="narrative">${narrative}</div>`:'')+
    `<div class="badges">${badges}</div>`;
}

/* Turn Plotly traces into an array-of-arrays table */
function tracesToRows(traces, fallbackName){
  traces=(traces||[]).filter(t=>t && t.visible!==false && t.hoverinfo!=='skip');
  if(!traces.length) return [['No data displayed']];
  const t0=traces[0], type=t0.type||'scatter';

  // Heatmap: rows = y labels, columns = x labels
  if(type==='heatmap'){
    const rows=[['', ...t0.x]];
    t0.y.forEach((yl,i)=>rows.push([yl, ...(t0.z[i]||[])]));
    return rows;
  }
  // Choropleth map
  if(type==='choropleth'){
    const rows=[['Region','Value']];
    t0.locations.forEach((l,i)=>rows.push([l,t0.z[i]]));
    return rows;
  }
  // Pie / donut
  if(type==='pie'){
    const rows=[['Label','Value']];
    t0.labels.forEach((l,i)=>rows.push([l,t0.values[i]]));
    return rows;
  }
  // Sankey
  if(type==='sankey'){
    const lab=t0.node.label, rows=[['From','To','Value']];
    t0.link.source.forEach((s,i)=>rows.push([lab[s],lab[t0.link.target[i]],t0.link.value[i]]));
    return rows;
  }
  // Box plots: long format, one row per point, with provider name if attached
  if(type==='box'){
    const rows=[['Group','Provider','Value']];
    for(const t of traces){
      (t.y||[]).forEach((v,i)=>{
        const real=(t.customdata&&t.customdata[i]!=null)?+t.customdata[i]:v;
        rows.push([t.name||'', (t.text&&t.text[i])||'', real]);
      });
    }
    return rows;
  }
  // Bar / scatter / line. Horizontal bars swap the axes.
  const horiz=traces.every(t=>t.orientation==='h');
  const catKey=horiz?'y':'x', valKey=horiz?'x':'y';
  // Scatter with per-point text (e.g. funnel plot, bubbles): long format
  const pointLevel=traces.some(t=>(t.mode||'').includes('markers') && Array.isArray(t.text) && t.text.length===(t[valKey]||[]).length && t.type!=='bar' && typeof (t.text[0]||'')==='string' && (t.text[0]||'').length>3 && !(t.mode||'').includes('lines'));
  if(pointLevel){
    const rows=[['Series','Label','X','Y']];
    for(const t of traces){
      (t.x||[]).forEach((xv,i)=>{
        const lbl=String((t.text&&t.text[i])||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
        rows.push([t.name||'', lbl, xv, (t.y||[])[i]]);
      });
    }
    return rows;
  }
  // Wide format: one row per category, one column per series
  const cats=[];const seen=new Set();
  for(const t of traces) for(const c of (t[catKey]||[])){const k=String(c);if(!seen.has(k)){seen.add(k);cats.push(c);}}
  const header=[horiz?'Category':'Year / category', ...traces.map((t,i)=>t.name||(traces.length===1&&fallbackName?fallbackName:('Series '+(i+1))))];
  const rows=[header];
  for(const c of cats){
    const r=[c];
    for(const t of traces){
      const idx=(t[catKey]||[]).findIndex(v=>String(v)===String(c));
      r.push(idx>=0?(t[valKey]||[])[idx]:null);
    }
    rows.push(r);
  }
  return rows;
}

/* ================= PDF INSTITUTION REPORT ================= */
/* Builds a multi-page A4 analytical report using jsPDF. All analysis is
   computed live from D — no pre-baked report data needed. */

const PDF_COLOURS = {
  purple: [62, 17, 81],   pink: [255, 0, 144],
  blue: [0, 133, 202],    green: [0, 179, 136],
  yellow: [254, 219, 0],  light: [170, 165, 187],
  ink: [36, 16, 50],      muted: [109, 100, 120],
  paper: [247, 247, 248]
};

function pdfFmtM(v) {
  if (v == null || !isFinite(v)) return '–';
  return '£' + (v >= 100000 ? (v/1000).toFixed(0) : (v/1000).toFixed(1)) + 'm';
}
function pdfFmtN(v) {
  if (v == null || !isFinite(v)) return '–';
  return Math.round(v).toLocaleString('en-GB');
}
function pdfCagr(a, b, yrs) {
  if (!a || !b || a <= 0 || b <= 0) return null;
  return (Math.pow(b/a, 1/yrs) - 1) * 100;
}
function pdfPercentile(val, pool) {
  const valid = pool.filter(v => v != null && isFinite(v));
  if (val == null || !valid.length) return null;
  return valid.filter(v => v <= val).length / valid.length * 100;
}

/* Categorise a CAGR into a narrative band */
function pdfCagrLabel(c) {
  if (c == null) return 'insufficient data';
  if (c >= 10) return 'significant growth';
  if (c >= 3) return 'moderate growth';
  if (c > -3) return 'broadly stable';
  if (c > -10) return 'moderate decline';
  return 'significant decline';
}

/* Pull a pool of values across providers matching a filter */
function pdfPool(metricKey, atYear, filterFn) {
  const yi = atYear == null ? D.years.length - 1 : atYear;
  return Object.values(D.unis).filter(filterFn || (() => true))
    .map(u => u[metricKey] && u[metricKey][yi])
    .filter(v => v != null);
}

/* Build the analytical narrative for a provider */
function pdfBuildAnalysis(u, ukprn) {
  const yi = D.years.length - 1;
  const yi5 = yi - 5;

  // Trends — 5-year CAGR for each key metric
  const trends = {
    bci:      { label: 'Real BCI',                          cagr: pdfCagr(u.real[yi5], u.real[yi], 5),         group: 'bci' },
    sme:      { label: 'BCI from SMEs',                     cagr: pdfCagr(u.real_sme[yi5], u.real_sme[yi], 5), group: 'bci' },
    lc:       { label: 'BCI from large business',           cagr: pdfCagr(u.real_lc[yi5], u.real_lc[yi], 5),   group: 'bci' },
    nsme:     { label: 'SME interactions',                  cagr: pdfCagr(u.n_sme[yi5], u.n_sme[yi], 5),       group: 'bci' },
    nlc:      { label: 'Large business interactions',       cagr: pdfCagr(u.n_lc[yi5], u.n_lc[yi], 5),         group: 'bci' },
    consult:  { label: 'Consultancy income',                cagr: pdfCagr(u.consult[yi5], u.consult[yi], 5),   group: 'bci' },
    fe:       { label: 'Facilities & equipment income',     cagr: pdfCagr(u.fe[yi5], u.fe[yi], 5),             group: 'bci' },
    contract: { label: 'Contract research income',          cagr: pdfCagr(u.contract[yi5], u.contract[yi], 5), group: 'bci' },
    lic:      { label: 'Licensing income',                  cagr: pdfCagr(u.lic[yi5], u.lic[yi], 5),           group: 'ip' },
    lic_sme:  { label: 'Licensing income — SMEs',           cagr: pdfCagr(u.lic_sme && u.lic_sme[yi5], u.lic_sme && u.lic_sme[yi], 5),  group: 'ip' },
    lic_lc:   { label: 'Licensing income — large business', cagr: pdfCagr(u.lic_lc && u.lic_lc[yi5], u.lic_lc && u.lic_lc[yi], 5),    group: 'ip' },
    lic_n:    { label: 'Licences granted',                  cagr: pdfCagr(u.lic_n[yi5], u.lic_n[yi], 5),       group: 'ip' },
    spin:     { label: 'Active spinouts (3+ years)',        cagr: pdfCagr(u.spin[yi5], u.spin[yi], 5),         group: 'ip' },
    ext:      { label: 'External investment in spinouts',   cagr: pdfCagr(u.ext[yi5], u.ext[yi], 5),           group: 'ip' },
    pat:      { label: 'Patents granted',                   cagr: pdfCagr(u.pat[yi5], u.pat[yi], 5),           group: 'ip' }
  };

  // Percentiles vs cluster, region, national
  const compareMetrics = [
    ['real', 'Real BCI', '£m'],
    ['real_sme', 'BCI from SMEs', '£m'],
    ['real_lc', 'BCI from large business', '£m'],
    ['n_sme', 'SME interactions', 'n'],
    ['n_lc', 'Large business interactions', 'n'],
    ['consult', 'Consultancy income', '£m'],
    ['contract', 'Contract research income', '£m'],
    ['lic', 'Licensing income', '£m'],
    ['lic_n', 'Licences granted', 'n'],
    ['spin', 'Spinouts (3+ years)', 'n']
  ];
  const benchmarks = compareMetrics.map(([key, name, unit]) => {
    const val = u[key] && u[key][yi];
    const clusterPool = pdfPool(key, yi, x => x.cluster === u.cluster);
    const regionPool  = pdfPool(key, yi, x => x.region === u.region);
    const allPool     = pdfPool(key, yi);
    return {
      key, name, unit, val,
      clusterMedian: clusterPool.length ? clusterPool.sort((a,b)=>a-b)[Math.floor(clusterPool.length/2)] : null,
      regionMedian:  regionPool.length ? regionPool.sort((a,b)=>a-b)[Math.floor(regionPool.length/2)] : null,
      ukMedian:      allPool.length ? allPool.sort((a,b)=>a-b)[Math.floor(allPool.length/2)] : null,
      pctCluster:    pdfPercentile(val, clusterPool),
      pctRegion:     pdfPercentile(val, regionPool),
      pctUk:         pdfPercentile(val, allPool)
    };
  });

  // Strengths: metrics where provider is in top quartile of cluster (≥75%)
  const strengths = benchmarks.filter(b => b.pctCluster != null && b.pctCluster >= 75 && b.val > 0)
    .sort((a,b) => b.pctCluster - a.pctCluster);
  // Plus any rapidly-growing metric
  for (const [k, v] of Object.entries(trends)) {
    if (v.cagr != null && v.cagr >= 10) {
      strengths.push({ name: v.label, cagr: v.cagr, isTrend: true });
    }
  }

  // Weaknesses: metrics in bottom quartile of cluster (<25%) OR in significant decline
  const weaknesses = benchmarks.filter(b => b.pctCluster != null && b.pctCluster < 25)
    .sort((a,b) => a.pctCluster - b.pctCluster);
  for (const [k, v] of Object.entries(trends)) {
    if (v.cagr != null && v.cagr <= -10) {
      weaknesses.push({ name: v.label, cagr: v.cagr, isTrend: true });
    }
  }

  return { trends, benchmarks, strengths, weaknesses };
}

/* Convert a Plotly chart (by element ID) to a PNG data URL for embedding */
async function pdfChartToImage(elId, width = 800, height = 400) {
  const el = document.getElementById(elId);
  if (!el || !el.data) return null;
  try {
    return await Plotly.toImage(el, { format: 'png', width, height, scale: 2 });
  } catch (e) { console.warn('chart export failed', elId, e); return null; }
}

async function pdfGenerateReport() {

    if (wasActive !== 'bci') {
      document.querySelector('#uniSubnav button[data-sub="bci"]').click();
      await new Promise(r => setTimeout(r, 800));   // allow Plotly to draw
    }

    const A = pdfBuildAnalysis(u, currentUni);
    const yrs = D.years;

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const W = 210, H = 297;
    const M = 15;                 // outer margin
    let cursor;

    // ─── helpers ────────────────────────────────────────────────────
    // ─── Unicode safety net ──────────────────────────────────────────
    // jsPDF's default PDF fonts use WinAnsi encoding; characters outside
    // it render as garbage (e.g. ●, ▲, ≥, →, emoji). Map to safe ASCII.
    const pdfSafe = s => {
      if (s == null) return '';
      return String(s)
        .replace(/[•●∙]/g, '-')
        .replace(/▲/g, '^')
        .replace(/▼/g, 'v')
        .replace(/[–—]/g, '-')
        .replace(/…/g, '...')
        .replace(/·/g, '|')
        .replace(/≥/g, '>=')
        .replace(/≤/g, '<=')
        .replace(/→/g, '->')
        .replace(/←/g, '<-')
        .replace(/[\u2500-\u257F]/g, '-')
        .replace(/[\u{1F000}-\u{1FFFF}]/gu, '')
        .replace(/[\u{2300}-\u{27BF}]/gu, '')
        // keep £ (0xA3), basic ASCII; strip everything else
        .replace(/[^\x20-\x7E\xA3]/g, '');
    };

    const setColor = (rgb, fn = 'setTextColor') => doc[fn](rgb[0], rgb[1], rgb[2]);
    const text = (s, x, y, opts = {}) => {
      const size = opts.size || 10;
      doc.setFontSize(size);
      if (opts.bold) doc.setFont('helvetica', 'bold');
      else if (opts.italic) doc.setFont('helvetica', 'italic');
      else doc.setFont('helvetica', 'normal');
      if (opts.color) setColor(opts.color);
      const lines = doc.splitTextToSize(pdfSafe(s), opts.width || W - M*2);
      doc.text(lines, x, y);
      return y + lines.length * size * 0.42;
    };
    // Wrap raw doc.text so direct calls get sanitised too
    const rawText = doc.text.bind(doc);
    doc.text = (text, x, y, opts) => {
      if (Array.isArray(text)) return rawText(text.map(pdfSafe), x, y, opts);
      return rawText(pdfSafe(text), x, y, opts);
    };
    const rect = (x, y, w, h, rgb, fill = 'F') => {
      setColor(rgb, 'setFillColor'); doc.rect(x, y, w, h, fill);
    };
    const line = (x1, y1, x2, y2, rgb = PDF_COLOURS.light) => {
      setColor(rgb, 'setDrawColor'); doc.setLineWidth(0.3); doc.line(x1, y1, x2, y2);
    };
    const newPage = () => { doc.addPage(); cursor = M + 8; };
    const footer = (pageNum) => {
      setColor(PDF_COLOURS.muted);
      doc.setFontSize(8);
      doc.setFont('helvetica', 'normal');

    doc.setFontSize(10); doc.setFont('helvetica', 'normal');
    doc.text('Institutional report', M, 35);
    doc.setFontSize(26); doc.setFont('helvetica', 'bold');
    const titleLines = doc.splitTextToSize(u.name, W - M*2);
    doc.text(titleLines, M, 56);
    doc.setFontSize(12); doc.setFont('helvetica', 'normal');

    const today = new Date().toLocaleDateString('en-GB', { year: 'numeric', month: 'long', day: 'numeric' });
    doc.text(`Generated ${today} · Data: HE-BCI panel ${yrs[0]}–${yrs[yi]}, constant prices`, M, 84);

    // Executive summary box

      const a = u[m] && u[m][yi-5], b = u[m] && u[m][yi];
      return [pdfSafe(x.label), fmt(a), fmt(b),
        (x.cagr > 0 ? '+' : '') + x.cagr.toFixed(1) + '%', pdfSafe(pdfCagrLabel(x.cagr))];
    };
    doc.autoTable({
      startY: cursor,
      head: [['Metric', `${yrs[yi-5]}`, `${yrs[yi]}`, 'CAGR', 'Trajectory']],
      body: Object.entries(t)
        .filter(([k,x]) => x.cagr != null && x.group === 'bci')
        .map(([k,x]) => trendRow(k,x)),
      theme: 'plain',
      styles: { fontSize: 9, cellPadding: 2 },
      headStyles: { fillColor: PDF_COLOURS.purple, textColor: [255,255,255], fontStyle: 'bold' },
      alternateRowStyles: { fillColor: PDF_COLOURS.paper },
      didParseCell: data => {
        if (data.section === 'body' && data.column.index === 4) {
          const c = String(data.cell.raw);
          if (c.includes('significant growth')) data.cell.styles.textColor = PDF_COLOURS.green;
          else if (c.includes('moderate growth')) data.cell.styles.textColor = [50, 130, 90];

      }
    });
    cursor = doc.lastAutoTable.finalY + 6;

    // Embed real BCI chart
    const bciImg = await pdfChartToImage('chUniBciTotal', 800, 360);
    if (bciImg && cursor < H - 80) {
      cursor = text('Real BCI vs benchmarks', M, cursor, { color: PDF_COLOURS.purple, size: 12, bold: true });
      cursor += 2;
      doc.addImage(bciImg, 'PNG', M, cursor, W - M*2, (W - M*2) * 0.45);

    }

    footer(2);

    // ─── PAGE 3 — LICENSING & SPINOUTS GROWTH ──────────────────────
    newPage();
    cursor = text('Licensing & spinouts: 5-year growth', M, cursor, { color: PDF_COLOURS.purple, size: 20, bold: true });
    cursor += 1;
    setColor(PDF_COLOURS.pink); doc.setLineWidth(1.5);
    doc.line(M, cursor, M + 38, cursor);
    cursor += 6;
    cursor = text(`Five-year trajectories for commercialisation indicators ${yrs[yi-5]} → ${yrs[yi]}, in constant ${yrs[yi]} prices.`,
      M, cursor, { color: PDF_COLOURS.muted, size: 10, italic: true });
    cursor += 5;

    // Narrative for IP/spinouts
    const ipNarr = [];
    if (t.lic.cagr != null) {
      ipNarr.push(`Licensing income overall registered ${pdfCagrLabel(t.lic.cagr)} at ${t.lic.cagr > 0 ? '+' : ''}${t.lic.cagr.toFixed(1)}% per year. ` +

    // IP trends table
    cursor += 2;
    doc.autoTable({
      startY: cursor,
      head: [['Metric', `${yrs[yi-5]}`, `${yrs[yi]}`, 'CAGR', 'Trajectory']],
      body: Object.entries(t)
        .filter(([k,x]) => x.cagr != null && x.group === 'ip')
        .map(([k,x]) => trendRow(k,x)),

    cursor = doc.lastAutoTable.finalY + 6;

    // Switch to IP sub-tab so its charts have rendered, then snapshot
    document.querySelector('#uniSubnav button[data-sub="ip"]').click();
    await new Promise(r => setTimeout(r, 800));
    const licImg = await pdfChartToImage('chUniLicTrend', 800, 320);

    if (spinImg && cursor < H - 70) {

    footer(3);

    // ─── PAGE 4 — STRENGTHS & WEAKNESSES ───────────────────────────
    newPage();
    cursor = text('Strengths & weaknesses', M, cursor, { color: PDF_COLOURS.purple, size: 20, bold: true });
    cursor += 1;
    setColor(PDF_COLOURS.pink); doc.setLineWidth(1.5);
    doc.line(M, cursor, M + 32, cursor);
    cursor += 6;
    cursor = text(`Strengths: top-quartile metrics within the ${u.cluster} cluster, plus measures growing significantly. Weaknesses: bottom-quartile metrics or those in significant decline.`,

    } else {
      for (const s of A.strengths.slice(0, 8)) {
        // Green up-triangle drawn with vector primitives (Unicode arrows

        setColor(PDF_COLOURS.green, 'setFillColor');
        doc.triangle(M, cursor - 1, M + 3.2, cursor - 1, M + 1.6, cursor - 3.6, 'F');
        const descr = s.isTrend
          ? `${s.name} is in significant growth (+${s.cagr.toFixed(1)}% per year over the past five years)`

        cursor = text(descr, M + 6, cursor, { color: PDF_COLOURS.ink, size: 10, width: W - M*2 - 6 });
        cursor += 1.5;
      }
    }
    cursor += 4;

    // Weaknesses block
    rect(M, cursor, W - M*2, 8, PDF_COLOURS.pink);
    setColor([255, 255, 255]); doc.setFont('helvetica', 'bold'); doc.setFontSize(11);
    doc.text('AREAS TO STRENGTHEN', M + 3, cursor + 5.7);
    cursor += 11;
    if (!A.weaknesses.length) {
      cursor = text('No metrics in the bottom quartile of cluster peers and none in significant decline.',
        M, cursor, { color: PDF_COLOURS.ink, size: 10, italic: true });
    } else {
      for (const w of A.weaknesses.slice(0, 8)) {
        // Pink down-triangle
        setColor(PDF_COLOURS.pink, 'setFillColor');
        doc.triangle(M, cursor - 3.6, M + 3.2, cursor - 3.6, M + 1.6, cursor - 1, 'F');
        const descr = w.isTrend
          ? `${w.name} is in significant decline (${w.cagr.toFixed(1)}% per year over the past five years)`
          : `${w.name}: ${w.unit === '£m' ? pdfFmtM(w.val) : pdfFmtN(w.val)} — ${Math.round(w.pctCluster)}th percentile in cluster, ${Math.round(w.pctRegion)}th in region, ${Math.round(w.pctUk)}th nationally`;
        cursor = text(descr, M + 6, cursor, { color: PDF_COLOURS.ink, size: 10, width: W - M*2 - 6 });
        cursor += 1.5;
      }
    }
    cursor += 6;

    cursor = text('Reading note: percentiles compare this provider against the live HE-BCI panel for the latest year, separately within its cluster, its region and the UK as a whole. A 75th-percentile reading means three quarters of peers had lower values; a 25th-percentile reading means only one quarter did.',
      M, cursor, { color: PDF_COLOURS.muted, size: 8.5, italic: true });

    footer(4);

    // ─── PAGE 5 — COMPARISONS ──────────────────────────────────────
    newPage();
    cursor = text('Comparisons', M, cursor, { color: PDF_COLOURS.purple, size: 20, bold: true });
    cursor += 1;
    setColor(PDF_COLOURS.pink); doc.setLineWidth(1.5);
    doc.line(M, cursor, M + 22, cursor);
    cursor += 6;
    cursor = text(`This institution against the median of its ${u.cluster.toLowerCase()} cluster, its ${u.region} regional median, and the UK national median, for ${yrs[yi]} in constant prices.`,
      M, cursor, { color: PDF_COLOURS.muted, size: 9.5, italic: true });
    cursor += 4;

    const fmtVal = (v, unit) => v == null ? '–' : (unit === '£m' ? pdfFmtM(v) : pdfFmtN(v));
    doc.autoTable({
      startY: cursor,
      head: [['Metric', 'This provider', 'Cluster median', 'Region median', 'UK median', 'Cluster %ile']],
      body: A.benchmarks.map(b => [
        pdfSafe(b.name), fmtVal(b.val, b.unit), fmtVal(b.clusterMedian, b.unit),
        fmtVal(b.regionMedian, b.unit), fmtVal(b.ukMedian, b.unit),
        b.pctCluster == null ? '-' : Math.round(b.pctCluster) + '%'
      ]),
      theme: 'plain',
      styles: { fontSize: 9, cellPadding: 2.2 },
      headStyles: { fillColor: PDF_COLOURS.purple, textColor: [255,255,255], fontStyle: 'bold', halign: 'center' },
      columnStyles: { 0: { fontStyle: 'bold' }, 1: { halign: 'right' }, 2: { halign: 'right' },
                     3: { halign: 'right' }, 4: { halign: 'right' }, 5: { halign: 'center' } },
      alternateRowStyles: { fillColor: PDF_COLOURS.paper },
      didParseCell: data => {
        if (data.section === 'body' && data.column.index === 5) {
          const v = parseInt(data.cell.raw);
          if (!isNaN(v)) {
            if (v >= 75) data.cell.styles.textColor = PDF_COLOURS.green;
            else if (v < 25) data.cell.styles.textColor = PDF_COLOURS.pink;
            data.cell.styles.fontStyle = 'bold';
          }
        }
      }
    });
    cursor = doc.lastAutoTable.finalY + 8;

    // Income mix chart
    const mixImg = await pdfChartToImage('chUniMix', 800, 360);
    if (mixImg && cursor < H - 70) {
      cursor = text('Income streams', M, cursor, { color: PDF_COLOURS.purple, size: 12, bold: true });
      cursor += 2;
      doc.addImage(mixImg, 'PNG', M, cursor, (W - M*2 - 4) / 2, ((W - M*2 - 4) / 2) * 0.5);
    }
    const smeImg = await pdfChartToImage('chUniSme', 800, 360);
    if (smeImg && cursor < H - 70) {
      const colW = (W - M*2 - 4) / 2;
      doc.addImage(smeImg, 'PNG', M + colW + 4, cursor, colW, colW * 0.5);
      cursor += colW * 0.5 + 6;
    }

    // Methodology
    cursor = Math.max(cursor, H - 40);
    cursor = text('Methodology', M, cursor, { color: PDF_COLOURS.purple, size: 11, bold: true });
    cursor = text('Source: HESA HE-BCI panel, 231 UK providers, 2014/15–2024/25. All income measures deflated to constant 2024/25 prices using CPI. Five-year CAGR computed as (value_t / value_{t-5})^(1/5) – 1. Percentile rank: share of pool with values at or below this provider. Cluster definitions follow Research England.',
      M, cursor + 1, { color: PDF_COLOURS.muted, size: 8, width: W - M*2 });

    footer(5);

    // Save
    const fname = u.name.replace(/[^\w]+/g, '_').replace(/^_+|_+$/g, '').toLowerCase() + '_cpm_report.pdf';
    doc.save(fname);
    note.textContent = `Report saved as ${fname}`;
    note.style.color = 'var(--green)';
  } catch (e) {
    console.error(e);
    note.textContent = 'Report generation failed: ' + e.message;
    note.style.color = 'var(--pink)';
  } finally {
    btn.disabled = false;
    btn.innerHTML = '📄 Generate PDF report';
    setTimeout(() => { note.style.display = 'none'; }, 8000);
  }
}
