/* ================= CASE STUDIES ================= */
const SECTOR_CLASS = {'life sciences':'s-life','engineering':'s-eng','digital & ICT':'s-dig',
  'energy & cleantech':'s-energy','creative & cultural':'s-creative','agri-food & environment':'s-agri',
  'finance & professional services':'s-fin'};
const SECTOR_COL = {'life sciences':C.pink,'engineering':C.blue,'digital & ICT':C.green,
  'energy & cleantech':'#88c14b','creative & cultural':'#d05fb3','agri-food & environment':'#c08f4a',
  'finance & professional services':C.pm,'Other / Unclassified':C.pl,
  'construction & infrastructure':'#c08f4a','retail & consumer':C.yellow,'space & defence':'#1f3a5f'};

function topCounts(items,key,limit){
  const m={};for(const it of items){const v=it[key];if(!v)continue;m[v]=(m[v]||0)+1;}
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k,v])=>({name:k,count:v}));
}

function renderCases(){
  const items=D.cases||[];
  if(!items.length){
    document.getElementById('casesEnrich').style.display='block';
    document.getElementById('caseGallery').innerHTML='<p class="note" style="grid-column:1/-1;text-align:center;padding:40px">No case studies loaded. Run <code>python fetch_case_studies.py</code> to populate.</p>';
    return;
  }
  if(items.length < 25) document.getElementById('casesEnrich').style.display='block';

  // Filter state — kept here so chart clicks AND dropdowns share it
  const state={q:'',sector:'',uni:'',theme:'',region:''};
  // Cache last-known full-population versions of the dropdowns so users can
  // jump *back* to a value that is filtered out by their current selection
  let allSectors=[], allUnis=[];

  // Build a label lookup so chip/dropdown/chart can switch between display
  // name (HESA he_provider) and the original case.university string.
  // Each case has c.uni_names (a list of matched HESA names). We "expand"
  // multi-uni cases into a list of (case, displayName) pairs for any chart
  // that aggregates by university — that way Loughborough+Cambridge counts
  // toward both, not just whichever appeared first.
  const expandByUni=arr=>{
    const out=[];
    for(const c of arr){
      const ns=c.uni_names && c.uni_names.length ? c.uni_names : (c.university?[c.university]:[]);
      if(!ns.length){out.push({c,uniName:null});continue;}
      for(const n of ns) out.push({c,uniName:n});
    }
    return out;
  };

  const applyFilters=()=>items.filter(c=>{
    if(state.sector && c.sector!==state.sector) return false;
    if(state.region && !(c.regions||[]).includes(state.region)) return false;
    if(state.uni){
      // exact ukprn lookup first; falls back to display name match
      const ukprns=c.ukprns||[];
      const names=c.uni_names||[c.university].filter(Boolean);
      if(!(ukprns.includes(state.uni) || names.includes(state.uni))) return false;
    }
    if(state.theme && !(c.topics||[]).includes(state.theme)) return false;
    if(state.q){
      const blob=((c.title||'')+' '+(c.university||'')+' '+(c.uni_names||[]).join(' ')+' '+(c.partner||'')+' '+(c.summary||'')).toLowerCase();
      if(!blob.includes(state.q)) return false;
    }
    return true;
  });


  // ── geography of collaboration storytelling ──
  const REGIONS_ORDERED=['Scotland','Northern Ireland','Wales','London','South East','South West','East of England','East Midlands','West Midlands','North West','North East','Yorkshire and The Humber'];
  const REGION_GROUP_COL={'Scotland':C.pm,'Northern Ireland':C.pm,'Wales':C.pm,
    'London':C.pink,'South East':C.pink,'South West':C.pink,
    'East of England':C.blue,'East Midlands':C.blue,'West Midlands':C.blue,
    'North West':C.green,'North East':C.green,'Yorkshire and The Humber':C.green};

  const drawGeo=(subset)=>{
  // Each case can have multiple regions (multi-uni stories). Count distinct
  // cases per region (so a Cambridge+UCL story counts once for East of England
  // and once for London, but only once per region).
  const regCnt={};
  for(const c of subset){
    for(const r of (c.regions||[])) regCnt[r]=(regCnt[r]||0)+1;
  }
  const total=subset.length;
  const placed=Object.values(regCnt).reduce((a,b)=>a+b,0);
  const top=Object.entries(regCnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const noRegion=subset.filter(c=>!c.regions||!c.regions.length).length;

  // ── choropleth ──
  const locs=[],vals=[],texts=[];
  for(const r of REGIONS_ORDERED){
    const v=regCnt[r]||0;
    locs.push(r); vals.push(v);
    const pct=total?(v/total*100).toFixed(0):0;
    texts.push(`<b>${r}</b><br>${v} case stud${v===1?'y':'ies'} (${pct}% of selection)<br><i>Click to filter</i>`);
  }
  Plotly.newPlot('chCasesGeoMap',[{
    type:'choropleth',geojson:D.geo,locations:locs,z:vals,
    featureidkey:'properties.region',text:texts,hovertemplate:'%{text}<extra></extra>',
    colorscale:[[0,'#f3eef7'],[0.4,'#aaa5bb'],[0.75,'#60537f'],[1,'#3e1151']],
    marker:{line:{color:'#fff',width:1.2}},
    colorbar:{thickness:12,len:.7,tickfont:{size:11},title:{text:'cases',font:{size:11}}}
  }],L({geo:{scope:'europe',fitbounds:'locations',projection:{type:'mercator'},
        bgcolor:'rgba(0,0,0,0)',showframe:false,showcoastlines:false,showland:false},
    margin:{l:0,r:0,t:6,b:0},height:440,dragmode:false}),CFG);
  const mapEl=document.getElementById('chCasesGeoMap');
  if(mapEl && mapEl.on){
    mapEl.on('plotly_click',ev=>{
      if(ev.points && ev.points[0]){
        const r=ev.points[0].location;
        state.region=(state.region===r?'':r);
        draw(true);
      }
    });
  }

  // ── narrative ──
  const narrative=document.getElementById('casesGeoNarrative');
  if(!total){narrative.innerHTML='<i>No case studies in the current selection.</i>';return;}
  let html='';
  if(top.length){
    const dominant=top[0];
    const pct=Math.round(dominant[1]/total*100);
    html+=`<b>${dominant[0]}</b> leads the selection with ${dominant[1]} case stud${dominant[1]===1?'y':'ies'} (${pct}% of the ${total}). `;
  }
  if(top.length>=3){
    html+=`The top three regions — <b>${top[0][0]}</b>, ${top[1][0]} and ${top[2][0]} — account for ${Math.round((top[0][1]+top[1][1]+top[2][1])/total*100)}% of stories. `;
  }
  // North-south split (excluding devolved nations and the geographic centre)
  const north=['North East','North West','Yorkshire and The Humber'].reduce((a,r)=>a+(regCnt[r]||0),0);
  const south=['London','South East','South West','East of England'].reduce((a,r)=>a+(regCnt[r]||0),0);
  const midlands=['East Midlands','West Midlands'].reduce((a,r)=>a+(regCnt[r]||0),0);
  const devolved=['Scotland','Wales','Northern Ireland'].reduce((a,r)=>a+(regCnt[r]||0),0);
  if(south && (north||midlands||devolved)){
    html+=`Southern England accounts for ${Math.round(south/total*100)}% of the cases; northern England ${Math.round(north/total*100)}%, the Midlands ${Math.round(midlands/total*100)}%, devolved nations ${Math.round(devolved/total*100)}%. `;
  }
  if(noRegion) html+=`<span style="color:#9b8fa8;font-style:italic">${noRegion} case stud${noRegion===1?'y is':'ies are'} unmatched to a HESA provider and therefore not on the map.</span>`;
  narrative.innerHTML=html;

  // ── regional bar (sorted descending, colour-grouped) ──
  const sortedRegs=REGIONS_ORDERED.filter(r=>regCnt[r]).sort((a,b)=>(regCnt[b]||0)-(regCnt[a]||0)).reverse();
  if(sortedRegs.length){
    Plotly.newPlot('chCasesGeoBar',[{
      type:'bar',orientation:'h',
      y:sortedRegs,x:sortedRegs.map(r=>regCnt[r]),
      marker:{color:sortedRegs.map(r=>REGION_GROUP_COL[r]||C.pl),opacity:.9},
      text:sortedRegs.map(r=>regCnt[r]),textposition:'outside',textfont:{size:11},
      hovertemplate:'%{y}: %{x} cases<extra></extra>'
    }],L({margin:{l:130,r:50,t:6,b:30},height:Math.max(220,sortedRegs.length*22),
          showlegend:false,xaxis:{rangemode:'tozero',title:{text:'Case studies',font:{size:11}}},
          yaxis:{tickfont:{size:11}}}),CFG);
    const barEl=document.getElementById('chCasesGeoBar');
    if(barEl && barEl.on) barEl.on('plotly_click',ev=>{
      const r=ev.points[0].y; state.region=(state.region===r?'':r); draw(true);});
  } else {
    document.getElementById('chCasesGeoBar').innerHTML='<p class="note" style="text-align:center;padding:30px">No region data in this slice.</p>';
  }

  // ── region × sector heatmap ──
  const rs={},allSectors=new Set();
  for(const c of subset){
    if(!c.sector) continue;
    for(const r of (c.regions||[])){
      (rs[r]=rs[r]||{})[c.sector]=(rs[r][c.sector]||0)+1;
      allSectors.add(c.sector);
    }
  }
  const rsRows=REGIONS_ORDERED.filter(r=>rs[r]).reverse();
  const rsCols=[...allSectors];
  if(rsRows.length && rsCols.length){
    const z=rsRows.map(r=>rsCols.map(s=>(rs[r]||{})[s]||0));
    Plotly.newPlot('chCasesGeoSector',[{
      type:'heatmap',z:z,x:rsCols,y:rsRows,
      colorscale:[[0,'#f3eef7'],[0.4,'#aaa5bb'],[0.75,'#60537f'],[1,'#3e1151']],
      showscale:true,colorbar:{thickness:10,len:.7,tickfont:{size:9}},
      hovertemplate:'%{y} × %{x}: %{z} cases<extra></extra>'
    }],L({margin:{l:130,r:30,t:6,b:100},height:Math.max(200,rsRows.length*26),
          xaxis:{tickangle:-30,tickfont:{size:10}},yaxis:{tickfont:{size:10.5}}}),CFG);
    const sEl=document.getElementById('chCasesGeoSector');
    if(sEl && sEl.on) sEl.on('plotly_click',ev=>{
      const p=ev.points[0]; if(p.z===0) return;
      state.region=p.y; state.sector=p.x; draw(true);});
  } else {
    document.getElementById('chCasesGeoSector').innerHTML='<p class="note" style="text-align:center;padding:30px">Not enough region × sector data.</p>';
  }

  // ── region × theme heatmap (top themes only) ──
  const rt={},themeFreq={};
  for(const c of subset){
    for(const t of (c.topics||[])){
      themeFreq[t]=(themeFreq[t]||0)+1;
      for(const r of (c.regions||[])){
        (rt[r]=rt[r]||{})[t]=(rt[r][t]||0)+1;
      }
    }
  }
  const topThemes=Object.entries(themeFreq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(e=>e[0]);
  const rtRows=REGIONS_ORDERED.filter(r=>rt[r]).reverse();
  if(rtRows.length && topThemes.length){
    const z=rtRows.map(r=>topThemes.map(t=>(rt[r]||{})[t]||0));
    Plotly.newPlot('chCasesGeoTheme',[{
      type:'heatmap',z:z,x:topThemes,y:rtRows,
      colorscale:[[0,'#fff3f9'],[0.4,'#ffa3d2'],[0.75,'#ff4cad'],[1,'#ff0090']],
      showscale:true,colorbar:{thickness:10,len:.7,tickfont:{size:9}},
      hovertemplate:'%{y} × %{x}: %{z} cases<extra></extra>'
    }],L({margin:{l:130,r:30,t:6,b:120},height:Math.max(200,rtRows.length*26),
          xaxis:{tickangle:-30,tickfont:{size:10}},yaxis:{tickfont:{size:10.5}}}),CFG);
    const tEl=document.getElementById('chCasesGeoTheme');
    if(tEl && tEl.on) tEl.on('plotly_click',ev=>{
      const p=ev.points[0]; if(p.z===0) return;
      state.region=p.y; state.theme=p.x; draw(true);});
  } else {
    document.getElementById('chCasesGeoTheme').innerHTML='<p class="note" style="text-align:center;padding:30px">Not enough region × theme data.</p>';
  }
  };

  // ── chart drawers operate on a subset ──
  let tu=[], topU=[], secs=[];   // exposed for click handlers below
  const drawCharts=(subset)=>{
    // For per-university aggregations, expand each case onto every matched uni
    const expanded=expandByUni(subset);
    const uniCounts={};
    for(const r of expanded){if(r.uniName) uniCounts[r.uniName]=(uniCounts[r.uniName]||0)+1;}
    tu=Object.entries(uniCounts).sort((a,b)=>b[1]-a[1]).slice(0,15)
       .map(([name,count])=>({name,count})).reverse();
    if(tu.length){
      Plotly.newPlot('chCasesUni',[{
        type:'bar',orientation:'h',
        y:tu.map(u=>u.name.replace('The University of','U.').replace('University of','U.').slice(0,40)),
        x:tu.map(u=>u.count),
        marker:{color:C.pd,opacity:.85},text:tu.map(u=>u.count),textposition:'outside',textfont:{size:11}
      }],L({margin:{l:200,r:50,t:10,b:40},height:Math.max(280,tu.length*28),showlegend:false,
            xaxis:{rangemode:'tozero',title:{text:'Case studies',font:{size:11}}}}),CFG);
    } else emptyChart('chCasesUni');

    // University × sector heatmap
    const us={},allSec=new Set();
    for(const r of expanded){
      const c=r.c;if(!r.uniName||!c.sector)continue;
      (us[r.uniName]=us[r.uniName]||{})[c.sector]=(us[r.uniName][c.sector]||0)+1;
      allSec.add(c.sector);}
    topU=Object.entries(us).map(([u,s])=>[u,Object.values(s).reduce((a,b)=>a+b,0)])
      .sort((a,b)=>b[1]-a[1]).slice(0,12).map(x=>x[0]);
    secs=[...allSec];
    if(topU.length && secs.length){
      const z=topU.map(u=>secs.map(s=>(us[u]||{})[s]||0));
      Plotly.newPlot('chCasesUniSector',[{
        type:'heatmap',
        z:z,x:secs,y:topU.map(u=>u.replace('The University of','U.').replace('University of','U.').slice(0,32)),
        colorscale:[[0,'#f3eef7'],[0.4,'#aaa5bb'],[0.75,'#60537f'],[1,'#3e1151']],
        showscale:true,colorbar:{thickness:12,len:.7,tickfont:{size:10}},
        hovertemplate:'%{y} × %{x}: %{z} case studies<extra></extra>'
      }],L({margin:{l:160,r:20,t:10,b:120},height:Math.max(280,topU.length*32),
            xaxis:{tickangle:-30,tickfont:{size:10.5}},yaxis:{tickfont:{size:11}}}),CFG);
    } else emptyChart('chCasesUniSector');

    // Sector donut
    const ts=topCounts(subset,'sector',15);
    if(ts.length){
      Plotly.newPlot('chCasesSector',[{
        type:'pie',hole:.55,labels:ts.map(s=>s.name),values:ts.map(s=>s.count),
        marker:{colors:ts.map(s=>SECTOR_COL[s.name]||C.pl),line:{color:'#fff',width:2}},
        textinfo:'percent',textposition:'inside',insidetextfont:{color:'#fff',size:11},
        hovertemplate:'%{label}: %{value} (%{percent})<extra></extra>',sort:false
      }],L({showlegend:true,legend:{orientation:'v',y:.5,x:1.02,font:{size:11}},
            margin:{l:10,r:160,t:10,b:10}}),CFG);
    } else emptyChart('chCasesSector');

    // Themes
    const tagMap={};
    for(const c of subset) for(const t of (c.topics||[])) tagMap[t]=(tagMap[t]||0)+1;
    const tt=Object.entries(tagMap).sort((a,b)=>b[1]-a[1]).slice(0,15);
    if(tt.length){
      Plotly.newPlot('chCasesThemes',[{
        type:'bar',orientation:'h',
        y:tt.map(t=>t[0]).reverse(),x:tt.map(t=>t[1]).reverse(),
        marker:{color:C.pink,opacity:.8},text:tt.map(t=>t[1]).reverse(),textposition:'outside',textfont:{size:11}
      }],L({margin:{l:200,r:50,t:10,b:40},height:Math.max(280,tt.length*26),showlegend:false,
            xaxis:{rangemode:'tozero',title:{text:'Mentions',font:{size:11}}}}),CFG);
    } else emptyChart('chCasesThemes','No topic tags in this slice.');

    // Re-attach click handlers (Plotly.newPlot wipes them on each redraw)
    attachChartClicks();
    drawGeo(subset);
    return {ts,tt};
  };

  const emptyChart=(id,msg)=>{
    const el=document.getElementById(id);
    el.innerHTML=`<p class="note" style="text-align:center;padding:40px">${msg||'No cases match the current filters.'}</p>`;
    el.data=null;
  };

  // ── theme dropdown (NEW) + sector + uni dropdowns ──
  const secSel=document.getElementById('caseSectorFilter');
  const uniSel=document.getElementById('caseUniFilter');
  const themeSel=document.getElementById('caseThemeFilter');

  // Populate dropdowns from the FULL dataset on first load — selecting a value
  // narrows the subset, so we don't want options to vanish on the user
  allSectors=topCounts(items,'sector',50);
  // Universities: count multi-uni cases for each institution they feature
  const uniCountsAll={};
  for(const r of expandByUni(items)){if(r.uniName) uniCountsAll[r.uniName]=(uniCountsAll[r.uniName]||0)+1;}
  allUnis=Object.entries(uniCountsAll).sort((a,b)=>b[1]-a[1])
                .map(([name,count])=>({name,count}));
  const allThemes=(()=>{const m={};for(const c of items)for(const t of (c.topics||[]))m[t]=(m[t]||0)+1;
    return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([n,c])=>({name:n,count:c}));})();
  secSel.innerHTML='<option value="">All sectors</option>'+
    allSectors.map(s=>`<option value="${s.name}">${escapeHtml(s.name)} (${s.count})</option>`).join('');
  uniSel.innerHTML='<option value="">All universities</option>'+
    allUnis.map(u=>`<option value="${u.name}">${escapeHtml(u.name.replace('The University of','U.'))} (${u.count})</option>`).join('');
  themeSel.innerHTML='<option value="">All themes</option>'+
    allThemes.map(t=>`<option value="${t.name}">${escapeHtml(t.name)} (${t.count})</option>`).join('');

  // ── chip selector: build once from full dataset, toggle on click ──
  const buildChips=()=>{
    const SECT_LIMIT=20, THEME_LIMIT=12, UNI_LIMIT=12;
    const chipHTML=(kind,opt,active,extra='')=>
      `<button class="dchip ${kind}${active?' active':''}" data-kind="${kind}" data-value="${escapeHtml(opt.name)}"${extra}>${escapeHtml(opt.name.replace('The University of','U.').replace('University of','U.'))}<span class="n">${opt.count}</span></button>`;
    document.getElementById('chipSectors').innerHTML=
      `<div class="chip-label">Sectors</div><div class="chip-group">`+
      allSectors.slice(0,SECT_LIMIT).map(s=>chipHTML('sector',s,state.sector===s.name)).join('')+
      `</div>`;
    const themesToShow = state.theme && !allThemes.slice(0,THEME_LIMIT).find(t=>t.name===state.theme)
      ? allThemes.slice(0,THEME_LIMIT-1).concat(allThemes.find(t=>t.name===state.theme))
      : allThemes.slice(0,THEME_LIMIT);
    document.getElementById('chipThemes').innerHTML=
      `<div class="chip-label">Themes</div><div class="chip-group">`+
      themesToShow.map(t=>chipHTML('theme',t,state.theme===t.name)).join('')+
      (allThemes.length>THEME_LIMIT?`<button class="dchip more" data-more="theme">+ ${allThemes.length-THEME_LIMIT} more themes</button>`:'')+
      `</div>`;
    const unisToShow = state.uni && !allUnis.slice(0,UNI_LIMIT).find(u=>u.name===state.uni)
      ? allUnis.slice(0,UNI_LIMIT-1).concat(allUnis.find(u=>u.name===state.uni))
      : allUnis.slice(0,UNI_LIMIT);
    document.getElementById('chipUnis').innerHTML=
      `<div class="chip-label">Universities</div><div class="chip-group">`+
      unisToShow.map(u=>chipHTML('uni',u,state.uni===u.name)).join('')+
      (allUnis.length>UNI_LIMIT?`<button class="dchip more" data-more="uni">+ ${allUnis.length-UNI_LIMIT} more in dropdown ↓</button>`:'')+
      `</div>`;
    const hasFilter=state.sector||state.theme||state.uni||state.q||state.region;
    document.getElementById('chipsClear').style.display=hasFilter?'inline-flex':'none';
  };

  // chip click → toggle filter (clicking active chip clears it)
  document.getElementById('caseChipPanel').onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='chipsClear'){state.q=state.sector=state.theme=state.uni=state.region='';draw();return;}
    if(b.dataset.more){
      // jump to the relevant dropdown for the long tail
      const target=b.dataset.more==='theme'?themeSel:uniSel;
      target.focus();target.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    const k=b.dataset.kind,v=b.dataset.value;
    if(!k)return;
    state[k]=(state[k]===v?'':v);
    draw(true);
  };

  // ── main re-render ──
  const draw=(scroll)=>{
    const filtered=applyFilters();
    drawCharts(filtered);
    drawInsights(items,filtered,state);
    drawGallery(filtered);
    // active filter pills
    const pills=[];
    if(state.sector) pills.push({label:'Sector: '+state.sector,key:'sector'});
    if(state.region) pills.push({label:'Region: '+state.region,key:'region'});
    if(state.uni)    pills.push({label:'University: '+state.uni.replace('The University of','U.').replace('University of','U.'),key:'uni'});
    if(state.theme)  pills.push({label:'Theme: '+state.theme,key:'theme'});
    if(state.q)      pills.push({label:'Search: "'+state.q+'"',key:'q'});
    document.getElementById('caseActiveFilters').innerHTML=
      pills.map(p=>`<button class="filter-pill" data-clear="${p.key}">${escapeHtml(p.label)} <span style="margin-left:6px;font-size:14px">×</span></button>`).join('')+
      (pills.length>1?'<button class="filter-pill clear-all">Clear all</button>':'');
    document.getElementById('caseGalleryTitle').textContent=
      `Case study gallery · ${filtered.length} of ${items.length}`;
    secSel.value=state.sector; uniSel.value=state.uni;
    themeSel.value=state.theme;
    document.getElementById('caseSearch').value=state.q;
    buildChips();
    if(scroll){
      const insights=document.getElementById('casesInsights');
      insights.scrollIntoView({behavior:'smooth',block:'start'});
    }
  };

  const drawGallery=(filtered)=>{
    document.getElementById('caseGallery').innerHTML=filtered.slice(0,200).map(c=>{
      const cls='casecard '+(SECTOR_CLASS[c.sector]||'');
      const tags=(c.topics||[]).slice(0,3).map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join('');
      // Prefer matched HESA names; fall back to the raw `university` field
      const unis=(c.uni_names&&c.uni_names.length?c.uni_names:[c.university].filter(Boolean))
        .map(n=>n.replace('The University of','U.').replace('University of','U.'));
      const uniLabel=unis.length>1?unis.slice(0,2).join(' · ')+(unis.length>2?' +'+(unis.length-2):''):(unis[0]||'');
      return `<a class="${cls}" href="${c.url}" target="_blank" rel="noopener">
        <div class="title">${escapeHtml(c.title)}</div>
        <div class="meta">
          ${uniLabel?'<b>'+escapeHtml(uniLabel)+'</b>':''}
          ${c.partner?'· '+escapeHtml(c.partner):''}
          ${c.date?'· '+escapeHtml(c.date):''}
        </div>
        <div class="summary">${escapeHtml((c.summary||'').slice(0,260))}${c.summary&&c.summary.length>260?'…':''}</div>
        <div class="footer">
          <div>${tags||'<span class="tag">'+escapeHtml(c.sector||'')+'</span>'}</div>
          <span class="read">Read →</span>
        </div></a>`;
    }).join('')+(filtered.length>200?`<p class="note" style="grid-column:1/-1;text-align:center;padding:20px">Showing first 200 of ${filtered.length}. Narrow the filters to see fewer.</p>`:'')
      ||'<p class="note" style="grid-column:1/-1;text-align:center;padding:40px">No case studies match these filters.</p>';
  };

  // ── click handlers (re-attached after every chart redraw) ──
  const attachChartClicks=()=>{
    const setF=(k,v)=>{state[k]=v;draw(true);};
    [['chCasesUni',ev=>{
      const lbl=ev.points[0].y;
      const match=tu.find(u=>u.name.replace('The University of','U.').replace('University of','U.').slice(0,40)===lbl);
      if(match) setF('uni',match.name);
    }],['chCasesSector',ev=>setF('sector',ev.points[0].label)],
       ['chCasesThemes',ev=>setF('theme',ev.points[0].y)],
       ['chCasesUniSector',ev=>{
        const p=ev.points[0];
        if(p.z===0) return;
        const match=topU.find(u=>u.replace('The University of','U.').replace('University of','U.').slice(0,32)===p.y);
        if(match){state.uni=match;state.sector=p.x;draw(true);}
      }]].forEach(([id,h])=>{
        const el=document.getElementById(id);
        if(el && el.on) el.on('plotly_click',h);
      });
  };

  // ── dropdown / search wiring ──
  document.getElementById('caseSearch').oninput=e=>{state.q=e.target.value.toLowerCase().trim();draw();};
  secSel.onchange=e=>{state.sector=e.target.value;draw();};
  uniSel.onchange=e=>{state.uni=e.target.value;draw();};
  themeSel.onchange=e=>{state.theme=e.target.value;draw();};
  document.getElementById('caseActiveFilters').onclick=e=>{
    const b=e.target.closest('button'); if(!b) return;
    if(b.classList.contains('clear-all')){state.q=state.sector=state.uni=state.theme=state.region='';}
    else if(b.dataset.clear){state[b.dataset.clear]='';}
    draw();
  };

  draw();
}

// ── insight panel: KPIs that recompute against the filtered subset ──
function drawInsights(all,filtered,state){
  const el=document.getElementById('casesInsights'); if(!el) return;
  const n=filtered.length, total=all.length;
  const unis=new Set(filtered.map(c=>c.university).filter(Boolean));
  const partners=new Set(filtered.map(c=>c.partner).filter(Boolean));
  const sectors=new Set(filtered.map(c=>c.sector).filter(s=>s&&s!=='Other / Unclassified'));
  const themes=(()=>{const m={};for(const c of filtered)for(const t of (c.topics||[]))m[t]=(m[t]||0)+1;
    return Object.entries(m).sort((a,b)=>b[1]-a[1]);})();
  const topTheme=themes[0];
  // Top university and its share of filtered set
  const uniCnt={};for(const c of filtered) if(c.university) uniCnt[c.university]=(uniCnt[c.university]||0)+1;
  const topUni=Object.entries(uniCnt).sort((a,b)=>b[1]-a[1])[0];

  const filterLabel=()=>{
    const bits=[];
    if(state.sector) bits.push(`<b>${escapeHtml(state.sector)}</b>`);
    if(state.theme)  bits.push(`<b>${escapeHtml(state.theme)}</b>`);
    if(state.uni)    bits.push(`featuring <b>${escapeHtml(state.uni.replace('The University of','U.').replace('University of','U.'))}</b>`);
    if(state.q)      bits.push(`matching "<b>${escapeHtml(state.q)}</b>"`);
    return bits.length?bits.join(' · '):'across the full case study corpus';
  };

  // Headline narrative
  let narrative;
  if(n===0){
    narrative=`No case studies match the current filters. Try broadening one of the criteria.`;
  } else if(n===total){
    narrative=`Browsing all <b>${n}</b> NCUB case studies. Use the chart clicks or dropdowns to drill into a sector, theme or institution.`;
  } else {
    narrative=`Showing <b>${n}</b> case studies (${Math.round(n/total*100)}% of corpus) ${filterLabel()}.`;
    if(topUni && n>=3) narrative+=` <b>${topUni[0].replace('The University of','U.').replace('University of','U.')}</b> is the most featured (${topUni[1]} of ${n}).`;
    if(topTheme && !state.theme && n>=3) narrative+=` Most common theme: <b>${topTheme[0]}</b> (${topTheme[1]} mentions).`;
  }

  el.innerHTML=
    `<div style="font-size:13px;letter-spacing:1.5px;font-weight:700;color:#d9b9ea;text-transform:uppercase">Selection insights</div>
     <div style="font-size:15px;color:#fff;margin-top:8px;line-height:1.5">${narrative}</div>
     <div class="kpis" style="margin-top:14px">
       <div class="kpi"><div class="v">${fmtN(n)}</div><div class="l">Case studies in selection</div></div>
       <div class="kpi b"><div class="v">${fmtN(unis.size)}</div><div class="l">Distinct universities</div></div>
       <div class="kpi g"><div class="v">${fmtN(partners.size)}</div><div class="l">Distinct business partners</div></div>
       <div class="kpi y"><div class="v">${fmtN(sectors.size)}</div><div class="l">Sectors represented</div></div>
     </div>`;
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}
window.addEventListener('resize',()=>{document.querySelectorAll('.tab.show .chart, #heroPulse').forEach(el=>{ if(el.data) Plotly.Plots.resize(el); });});
</script>
</body>
</html>
